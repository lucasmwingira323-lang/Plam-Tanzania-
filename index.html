<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAM TANZANIA</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}header{background:#0b6b3a;color:#fff;padding:20px}.wrap{max-width:900px;margin:auto;padding:18px}.search,input,select,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}.cats,.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cat,.card,.form{background:#fff;padding:15px;border-radius:14px;box-shadow:0 2px 8px #0001}.cat{text-align:center}.pic{height:100px;background:#e9eef0;border-radius:10px;display:grid;place-items:center;font-size:42px}.price{font-weight:bold;margin:7px 0}button{padding:12px 16px;border:0;border-radius:10px;background:#0b6b3a;color:#fff}nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}nav button{background:none;color:#17202a}.hidden{display:none}@media(min-width:650px){.cats{grid-template-columns:repeat(4,1fr)}.products{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><div style="font-size:25px;font-weight:bold">🇹🇿 PLAM TANZANIA</div><div>Jenga biashara yako. Fikia wateja zaidi.</div></header><main class="wrap"><section id="home"><input id="search" class="search" placeholder="🔍 Tafuta bidhaa au huduma..." oninput="render()"><h2>📂 Categories</h2><div class="cats"><div class="cat">👕<br>Mavazi</div><div class="cat">📱<br>Electronics</div><div class="cat">🏠<br>Nyumba</div><div class="cat">🚗<br>Magari</div><div class="cat">🌾<br>Kilimo</div><div class="cat">💄<br>Urembo</div><div class="cat">📚<br>Elimu</div><div class="cat">🔧<br>Huduma</div></div><h2>🔥 Bidhaa</h2><div id="products" class="products"></div></section><section id="add" class="hidden"><h2>➕ Weka Bidhaa Yako</h2><div class="form"><input id="name" placeholder="Jina la bidhaa"><input id="price" type="number" placeholder="Bei (TSh)"><select id="category"><option>Mavazi</option><option>Electronics</option><option>Nyumba</option><option>Magari</option><option>Kilimo</option><option>Urembo</option><option>Elimu</option><option>Huduma</option></select><input id="place" placeholder="Eneo, mfano Mbeya"><textarea id="desc" placeholder="Maelezo ya bidhaa"></textarea><button onclick="add()">Chapisha Bidhaa</button></div></section><section id="account" class="hidden"><h2>👤 Akaunti</h2><div class="form"><input placeholder="Jina kamili"><input placeholder="Namba ya simu"><input type="password" placeholder="Password"><button onclick="alert('Prototype: akaunti imehifadhiwa!')">Jisajili / Ingia</button></div></section></main><nav><button onclick="show('home')">🏠<br>Home</button><button onclick="show('home');search.focus()">🔍<br>Tafuta</button><button onclick="show('add')">➕<br>Weka Bidhaa</button><button onclick="alert('Ujumbe wa mnunuzi na muuzaji utaongezwa hapa.')">💬<br>Ujumbe</button><button onclick="show('account')">👤<br>Akaunti</button></nav><script>let ps=[['Samsung A05',250000,'Electronics','Mbeya','📱'],['Viatu vya Michezo',45000,'Mavazi','Mbinga','👟'],['Sofa Set',650000,'Nyumba','Mbeya','🛋️'],['Mbegu za Mahindi',12000,'Kilimo','Ruvuma','🌾']];function render(){let q=search.value.toLowerCase();products.innerHTML=ps.filter(p=>(p[0]+' '+p[2]+' '+p[3]).toLowerCase().includes(q)).map(p=>`<div class="card"><div class="pic">${p[4]}</div><b>${p[0]}</b><div class="price">TSh ${p[1].toLocaleString()}</div><small>📍 ${p[3]}</small><br><br><button onclick="alert('Mawasiliano na muuzaji yatafunguliwa hapa.')">Wasiliana na Muuzaji</button></div>`).join('')}function add(){if(!name.value||!price.value||!place.value)return alert('Jaza jina, bei na eneo.');ps.unshift([name.value,+price.value,category.value,place.value,'🛍️']);render();show('home');alert('Bidhaa imechapishwa!')}function show(id){['home','add','account'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}render();</script></body></html>
