<!doctype html>
<html lang="sw">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PLAM TANZANIA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f6f8;
color:#17202a;
padding-bottom:80px;
}

header{
background:#0b6b3a;
color:white;
padding:20px;
}

.title{
font-size:25px;
font-weight:bold;
}

.subtitle{
margin-top:6px;
}

.top-buttons{
background:white;
padding:15px;
text-align:center;
}

.top-buttons button{
margin:3px;
}

.wrap{
max-width:900px;
margin:auto;
padding:18px;
}

.search,
input,
select,
textarea{
width:100%;
padding:13px;
margin:8px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

textarea{
min-height:100px;
resize:vertical;
}

button{
padding:12px 16px;
border:0;
border-radius:10px;
background:#0b6b3a;
color:white;
font-size:15px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.cats,
.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.cat,
.card,
.form{
background:white;
padding:15px;
border-radius:14px;
box-shadow:0 2px 8px #0001;
}

.cat{
text-align:center;
font-weight:bold;
cursor:pointer;
}

.cat .icon{
display:block;
font-size:35px;
margin-bottom:6px;
}

.pic{
height:100px;
background:#e9eef0;
border-radius:10px;
display:grid;
place-items:center;
font-size:42px;
}

.price{
font-weight:bold;
font-size:18px;
color:#0b6b3a;
margin:8px 0;
}

.card h3{
margin-bottom:5px;
}

.message{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
}

.hidden{
display:none !important;
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
padding:8px;
z-index:1000;
}

nav button{
background:none;
color:#17202a;
font-size:13px;
padding:6px;
}

nav button.active{
color:#0b6b3a;
font-weight:bold;
}

.account-title{
margin-top:0;
}

.form button{
margin-top:8px;
}

.small-text{
font-size:13px;
color:#666;
}

.add-title{
text-align:center;
}

.back-button{
background:#555;
width:100%;
margin-top:10px;
}

@media(min-width:650px){

.cats{
grid-template-columns:repeat(4,1fr);
}

.products{
grid-template-columns:repeat(3,1fr);
}

}

</style>

</head>

<body>


<!-- ================= HEADER ================= -->

<header>

<div class="title">
🇹🇿 PLAM TANZANIA
</div>

<div class="subtitle">
Jenga biashara yako. Fikia wateja zaidi.
</div>

</header>


<!-- ================= TOP BUTTONS ================= -->

<div class="top-buttons">

<button
type="button"
onclick="openRegister()">
Fungua Akaunti
</button>

<button
type="button"
onclick="openLogin()">
Ingia
</button>

<button
type="button"
onclick="showSection('add')">
➕ Weka Bidhaa
</button>

</div>


<main class="wrap">


<!-- ================= HOME ================= -->

<section id="home">

<input
id="search"
class="search"
placeholder="🔍 Tafuta bidhaa au huduma..."
>

<h2>📂 Categories</h2>

<div class="cats">

<div class="cat" data-category="Mavazi">
<span class="icon">👕</span>
Mavazi
</div>

<div class="cat" data-category="Electronics">
<span class="icon">📱</span>
Electronics
</div>

<div class="cat" data-category="Nyumba">
<span class="icon">🏠</span>
Nyumba
</div>

<div class="cat" data-category="Magari">
<span class="icon">🚗</span>
Magari
</div>

<div class="cat" data-category="Kilimo">
<span class="icon">🌾</span>
Kilimo
</div>

<div class="cat" data-category="Urembo">
<span class="icon">💄</span>
Urembo
</div>

<div class="cat" data-category="Elimu">
<span class="icon">📚</span>
Elimu
</div>

<div class="cat" data-category="Huduma">
<span class="icon">🔧</span>
Huduma
</div>

</div>


<h2>🔥 Bidhaa</h2>

<div id="products" class="products"></div>

</section>


<!-- ================= ADD PRODUCT ================= -->

<section id="add" class="hidden">

<h2 class="add-title">
➕ Weka Bidhaa Yako
</h2>

<div class="form">

<label>Jina la bidhaa</label>

<input
id="name"
type="text"
placeholder="Mfano: Samsung A05"
>


<label>Bei</label>

<input
id="price"
type="number"
placeholder="Mfano: 250000"
>


<label>Category</label>

<select id="category">

<option value="Mavazi">Mavazi</option>
<option value="Electronics">Electronics</option>
<option value="Nyumba">Nyumba</option>
<option value="Magari">Magari</option>
<option value="Kilimo">Kilimo</option>
<option value="Urembo">Urembo</option>
<option value="Elimu">Elimu</option>
<option value="Huduma">Huduma</option>

</select>


<label>Eneo</label>

<input
id="place"
type="text"
placeholder="Mfano: Mbeya"
>


<label>Maelezo ya bidhaa</label>

<textarea
id="desc"
placeholder="Andika maelezo ya bidhaa yako hapa..."
></textarea>


<button
type="button"
onclick="addProduct()">
📢 Chapisha Bidhaa
</button>


<button
type="button"
onclick="showSection('home')"
class="back-button">
⬅️ Rudi Home
</button>

</div>

</section>


<!-- ================= ACCOUNT ================= -->

<section id="account" class="hidden">

<h2 class="account-title">
👤 Akaunti
</h2>


<!-- REGISTER -->

<div id="registerBox" class="form">

<h3>Fungua Akaunti</h3>

<input
id="fullName"
type="text"
placeholder="Jina kamili"
>

<input
id="phone"
type="tel"
placeholder="Namba ya simu"
>

<input
id="email"
type="email"
placeholder="Barua pepe"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button
type="button"
onclick="registerUser()">
Jisajili
</button>

<p class="small-text">
Baada ya kujisajili, utatakiwa kuthibitisha email yako.
</p>

<button
type="button"
onclick="openLogin()">
Nina akaunti tayari
</button>

</div>


<!-- LOGIN -->

<div id="loginBox" class="form hidden">

<h3>Ingia kwenye Akaunti</h3>

<input
id="loginEmail"
type="email"
placeholder="Barua pepe"
>

<input
id="loginPassword"
type="password"
placeholder="Password"
>

<button
type="button"
onclick="loginUser()">
Ingia
</button>

<br><br>

<button
type="button"
onclick="openRegister()">
Fungua Akaunti Mpya
</button>

</div>


<!-- USER -->

<div id="userBox" class="form hidden">

<h3>✅ Umeingia</h3>

<p id="userEmail"></p>

<button
type="button"
onclick="logoutUser()">
Toka
</button>

</div>

</section>

</main>


<!-- ================= BOTTOM NAV ================= -->

<nav>

<button
type="button"
onclick="showSection('home')">
🏠<br>
Home
</button>


<button
type="button"
onclick="searchPage()">
🔍<br>
Tafuta
</button>


<button
type="button"
onclick="showSection('add')">
➕<br>
Weka Bidhaa
</button>


<button
type="button"
onclick="messagePage()">
💬<br>
Ujumbe
</button>


<button
type="button"
onclick="openRegister()">
👤<br>
Akaunti
</button>

</nav>


<script>


// ======================================================
// SUPABASE
// ======================================================

const SUPABASE_URL =
"https://igcgcxkttzeaordqhqqy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9M77SZxUBNK1srWkuGP11w_Y4ES8s8D";

let supabaseClient = null;

try{

if(
window.supabase &&
typeof window.supabase.createClient === "function"
){

supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

console.log("Supabase imeunganishwa.");

}

}catch(error){

console.log(
"Supabase error:",
error
);

}


// ======================================================
// VARIABLES
// ======================================================

let ps = [];

const home =
document.getElementById("home");

const addSection =
document.getElementById("add");

const account =
document.getElementById("account");

const productsBox =
document.getElementById("products");

const searchInput =
document.getElementById("search");


// ======================================================
// SHOW SECTION
// ======================================================

function showSection(id){

home.classList.add("hidden");

addSection.classList.add("hidden");

account.classList.add("hidden");


if(id === "home"){

home.classList.remove("hidden");

}


if(id === "add"){

addSection.classList.remove("hidden");

}


if(id === "account"){

account.classList.remove("hidden");

}


window.scrollTo(0,0);

}


// ======================================================
// REGISTER
// ======================================================

function openRegister(){

showSection("account");

document
.getElementById("registerBox")
.classList
.remove("hidden");

document
.getElementById("loginBox")
.classList
.add("hidden");

}


// ======================================================
// LOGIN
// ======================================================

function openLogin(){

showSection("account");

document
.getElementById("registerBox")
.classList
.add("hidden");

document
.getElementById("loginBox")
.classList
.remove("hidden");

}


// ======================================================
// SEARCH
// ======================================================

function searchPage(){

showSection("home");

setTimeout(function(){

searchInput.focus();

},100);

}


// ======================================================
// MESSAGE
// ======================================================

function messagePage(){

alert(
"💬 Ujumbe wa mnunuzi na muuzaji utaongezwa hapa."
);

}


// ======================================================
// LOAD PRODUCTS
// ======================================================

async function loadProducts(){

if(!supabaseClient){

showSampleProducts();

return;

}


try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/Production?select=*",

{

method:"GET",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY

}

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


ps =
await response.json();

render();


}catch(error){

console.log(
"Load products error:",
error
);

showSampleProducts();

}

}


// ======================================================
// SAMPLE PRODUCTS
// ======================================================

function showSampleProducts(){

ps = [

{
name:"Samsung A05",
price:250000,
category:"Electronics",
place:"Mbeya",
description:"Samsung A05 nzuri.",
icon:"📱"
},

{
name:"Viatu vya Michezo",
price:45000,
category:"Mavazi",
place:"Mbinga",
description:"Viatu vizuri vya michezo.",
icon:"👟"
},

{
name:"Sofa Set",
price:650000,
category:"Nyumba",
place:"Mbeya",
description:"Sofa nzuri kwa matumizi ya nyumbani.",
icon:"🛋️"
},

{
name:"Mbegu za Mahindi",
price:12000,
category:"Kilimo",
place:"Ruvuma",
description:"Mbegu bora za mahindi.",
icon:"🌾"
}

];

render();

}


// ======================================================
// RENDER PRODUCTS
// ======================================================

function render(){

const search =
searchInput.value
.toLowerCase()
.trim();


const filtered =
ps.filter(product => {

const name =
String(product.name || "")
.toLowerCase();

const category =
String(product.category || "")
.toLowerCase();

const place =
String(product.place || "")
.toLowerCase();

const description =
String(product.description || "")
.toLowerCase();


return(

name.includes(search) ||
category.includes(search) ||
place.includes(search) ||
description.includes(search)

);

});


if(filtered.length === 0){

productsBox.innerHTML =
"<div class='message'>" +
"Hakuna bidhaa zilizopatikana." +
"</div>";

return;

}


productsBox.innerHTML =
filtered.map(product => {

const icon =
product.icon || "🛍️";

const price =
Number(product.price || 0)
.toLocaleString("sw-TZ");


return `

<div class="card">

<div class="pic">
${icon}
</div>

<h3>
${escapeHTML(product.name || "")}
</h3>

<div class="price">
TSh ${price}
</div>

<div>
📂 ${escapeHTML(product.category || "")}
</div>

<div>
📍 ${escapeHTML(product.place || "")}
</div>

<p>
${escapeHTML(product.description || "")}
</p>

<button
type="button"
class="contactBtn"
data-product="${escapeHTML(product.name || "")}">
Wasiliana na Muuzaji
</button>

</div>

`;

}).join("");


document
.querySelectorAll(".contactBtn")
.forEach(button => {

button.onclick = function(){

const productName =
this.getAttribute("data-product");

alert(
"Mawasiliano na muuzaji wa " +
productName +
" yatafunguliwa hapa."
);

};

});

}


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


// ======================================================
// SEARCH
// ======================================================

searchInput.addEventListener(
"input",
function(){

render();

});


// ======================================================
// CATEGORY
// ======================================================

document
.querySelectorAll(".cat")
.forEach(category => {

category.onclick = function(){

const value =
this.getAttribute("data-category");

searchInput.value =
value;

showSection("home");

render();

};

});


// ======================================================
// ADD PRODUCT
// ======================================================

async function addProduct(){

const name =
document
.getElementById("name")
.value
.trim();

const price =
document
.getElementById("price")
.value
.trim();

const category =
document
.getElementById("category")
.value;

const place =
document
.getElementById("place")
.value
.trim();

const description =
document
.getElementById("desc")
.value
.trim();


if(!name || !price || !place){

alert(
"⚠️ Jaza jina, bei na eneo."
);

return;

}


if(Number(price) <= 0){

alert(
"⚠️ Weka bei sahihi."
);

return;

}


if(!supabaseClient){

alert(
"❌ Supabase haijaunganishwa."
);

return;

}


try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/Production",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

name:name,

price:Number(price),

category:category,

place:place,

description:description

})

}

);


if(!response.ok){

const error =
await response.text();

console.log(
"Supabase insert error:",
error
);

throw new Error(error);

}


alert(
"🎉 Bidhaa imehifadhiwa kwenye PLAM!"
);


document
.getElementById("name")
.value="";

document
.getElementById("price")
.value="";

document
.getElementById("place")
.value="";

document
.getElementById("desc")
.value="";


await loadProducts();

showSection("home");


}catch(error){

console.log(
"ADD PRODUCT ERROR:",
error
);

alert(
"❌ Bidhaa haijahifadhiwa.\n\n" +
error.message
);

}

}


// ======================================================
// REGISTER USER
// ======================================================

async function registerUser(){

if(!supabaseClient){

alert(
"❌ Supabase haijaunganishwa."
);

return;

}


const fullName =
document
.getElementById("fullName")
.value
.trim();

const phone =
document
.getElementById("phone")
.value
.trim();

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;


if(
!fullName ||
!phone ||
!email ||
!password
){

alert(
"⚠️ Tafadhali jaza taarifa zote."
);

return;

}


if(password.length < 6){

alert(
"⚠️ Password iwe na angalau herufi 6."
);

return;

}


try{

const result =
await supabaseClient.auth.signUp({

email:email,

password:password,

options:{

data:{

full_name:
fullName,

phone:
phone

}

}

});


if(result.error){

alert(
"❌ Usajili umeshindikana:\n\n" +
result.error.message
);

return;

}


alert(
"✅ Akaunti imefunguliwa!\n\n" +
"Angalia email yako kwa uthibitisho."
);


}catch(error){

console.log(error);

alert(
"❌ Kuna tatizo wakati wa usajili."
);

}

}


// ======================================================
// LOGIN USER
// ======================================================

async function loginUser(){

if(!supabaseClient){

alert(
"❌ Supabase haijaunganishwa."
);

return;

}


const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;


if(!email || !password){

alert(
"⚠️ Weka email na password."
);

return;

}


try{

const result =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(result.error){

alert(
"❌ Kuingia kumeshindikana:\n\n" +
result.error.message
);

return;

}


alert(
"✅ Umefanikiwa kuingia kwenye PLAM!"
);


showUser(
result.data.user
);

}catch(error){

console.log(error);

alert(
"❌ Kuna tatizo wakati wa kuingia."
);

}

}


// ======================================================
// SHOW USER
// ======================================================

function showUser(user){

document
.getElementById("registerBox")
.classList
.add("hidden");

document
.getElementById("loginBox")
.classList
.add("hidden");

document
.getElementById("userBox")
.classList
.remove("hidden");


document
.getElementById("userEmail")
.textContent =
"📧 " +
(user.email || "");

}


// ======================================================
// LOGOUT
// ======================================================

async function logoutUser(){

if(supabaseClient){

await supabaseClient.auth.signOut();

}


document
.getElementById("userBox")
.classList
.add("hidden");


document
.getElementById("registerBox")
.classList
.remove("hidden");


showSection("home");


alert(
"Umetoka kwenye akaunti."
);

}


// ======================================================
// SESSION
// ======================================================

async function checkSession(){

if(!supabaseClient){

return;

}


const result =
await supabaseClient.auth.getSession();


if(result.data.session){

showUser(
result.data.session.user
);

}

}


// ======================================================
// START PLAM
// ======================================================

showSection("home");

loadProducts();

checkSession();


</script>

</body>

</html>
