<!DOCTYPE html>
<html lang="sw">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLAM TANZANIA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#222;
}

header{
background:#008000;
color:white;
text-align:center;
padding:18px;
}

header h1{
margin:0;
font-size:28px;
}

header p{
margin:7px 0 0;
}

nav{
display:flex;
justify-content:space-around;
align-items:center;
background:white;
padding:10px;
position:sticky;
top:0;
z-index:100;
box-shadow:0 2px 6px #ccc;
}

nav button{
background:white;
border:0;
padding:10px 8px;
font-size:14px;
cursor:pointer;
}

.wrap{
max-width:1000px;
margin:auto;
padding:15px;
}

.hidden{
display:none !important;
}

/* SEARCH */

.search{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
margin-bottom:15px;
}

/* CATEGORIES */

.categories{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-bottom:20px;
}

.categories button{
border:0;
background:white;
padding:12px 5px;
border-radius:10px;
box-shadow:0 2px 5px #ddd;
cursor:pointer;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:1fr;
gap:15px;
}

.card{
width:100%;
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 8px #ddd;
}

.product-image{
width:100%;
max-height:500px;
display:block;
object-fit:contain;
background:#eee;
}

.no-image{
width:100%;
height:220px;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
background:#eee;
}

.card-body{
padding:14px;
}

.card h3{
margin:0 0 8px;
}

.price{
font-weight:bold;
color:#008000;
font-size:18px;
}

.small{
font-size:14px;
color:#666;
margin:6px 0;
}

.card-buttons{
display:flex;
gap:8px;
margin-top:12px;
}

.card-buttons button{
flex:1;
border:0;
border-radius:8px;
padding:10px;
cursor:pointer;
}

.call{
background:#008000;
color:white;
}

.whatsapp{
background:#25D366;
color:white;
}

/* FORM */

.form-box{
width:100%;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px #ddd;
margin-top:15px;
}

.form-box h2{
margin-top:0;
margin-bottom:20px;
}

.form-box label{
display:block;
font-weight:bold;
margin-top:14px;
margin-bottom:6px;
}

.form-box input,
.form-box select,
.form-box textarea{
display:block;
width:100%;
padding:14px;
border:1px solid #bbb;
border-radius:9px;
font-size:16px;
background:white;
color:#222;
}

.form-box input:focus,
.form-box select:focus,
.form-box textarea:focus{
outline:none;
border:2px solid #008000;
}

.form-box textarea{
resize:vertical;
min-height:100px;
}

.form-box input[type="file"]{
padding:10px;
background:#fafafa;
cursor:pointer;
}

.save-button{
width:100%;
padding:15px;
margin-top:20px;
border:0;
border-radius:9px;
background:#008000;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.save-button:disabled{
background:#777;
cursor:not-allowed;
}

/* IMAGE PREVIEW */

.image-preview{
display:none;
width:100%;
max-height:350px;
object-fit:contain;
margin-top:12px;
border-radius:10px;
background:#eee;
border:1px solid #ddd;
}

/* ACCOUNT */

.account-buttons{
display:flex;
gap:10px;
}

.account-buttons button{
flex:1;
padding:13px;
border:0;
border-radius:8px;
background:#008000;
color:white;
font-size:15px;
cursor:pointer;
}

.account-form{
margin-top:20px;
}

/* FOOTER */

footer{
text-align:center;
padding:25px;
color:#777;
}

/* MOBILE */

@media(max-width:600px){

.categories{
grid-template-columns:repeat(2,1fr);
}

nav button{
font-size:12px;
padding:8px 4px;
}

.form-box{
padding:16px;
}

}

</style>

</head>

<body>


<!-- HEADER -->

<header>

<h1>🇹🇿 PLAM TANZANIA</h1>

<p>
Jenga biashara yako. Fikia wateja zaidi.
</p>

</header>


<!-- NAVIGATION -->

<nav>

<button onclick="show('home')">
🏠 Mwanzo
</button>

<button onclick="goSearch()">
🔍 Tafuta
</button>

<button onclick="openAddProduct()">
➕ Weka Bidhaa
</button>

<button onclick="show('account')">
👤 Akaunti
</button>

</nav>


<main class="wrap">


<!-- ==========================
     HOME
========================== -->

<section id="home">

<input
id="search"
class="search"
type="text"
placeholder="🔍 Tafuta bidhaa au huduma..."
oninput="render()"
>

<div class="categories">

<button onclick="filterCategory('')">
🌐 Zote
</button>

<button onclick="filterCategory('Mavazi')">
👕 Mavazi
</button>

<button onclick="filterCategory('Electronics')">
📱 Electronics
</button>

<button onclick="filterCategory('Nyumba')">
🏠 Nyumba
</button>

<button onclick="filterCategory('Magari')">
🚗 Magari
</button>

<button onclick="filterCategory('Kilimo')">
🌾 Kilimo
</button>

<button onclick="filterCategory('Urembo')">
💄 Urembo
</button>

<button onclick="filterCategory('Elimu')">
📚 Elimu
</button>

<button onclick="filterCategory('Huduma')">
🛠️ Huduma
</button>

</div>

<div
id="products"
class="products"
>
</div>

</section>


<!-- ==========================
     ADD PRODUCT
========================== -->

<section id="add" class="hidden">

<div class="form-box">

<h2>➕ Weka Bidhaa</h2>


<label for="name">
Jina la bidhaa
</label>

<input
id="name"
type="text"
placeholder="Mfano: Samsung A05"
autocomplete="off"
>


<label for="price">
Bei kwa TZS
</label>

<input
id="price"
type="number"
placeholder="Mfano: 50000"
inputmode="numeric"
>


<label for="category">
Chagua kundi
</label>

<select id="category">

<option value="">
Chagua kundi
</option>

<option value="Mavazi">
Mavazi
</option>

<option value="Electronics">
Electronics
</option>

<option value="Nyumba">
Nyumba
</option>

<option value="Magari">
Magari
</option>

<option value="Kilimo">
Kilimo
</option>

<option value="Urembo">
Urembo
</option>

<option value="Elimu">
Elimu
</option>

<option value="Huduma">
Huduma
</option>

</select>


<label for="place">
Mahali bidhaa ilipo
</label>

<input
id="place"
type="text"
placeholder="Mfano: Mbeya"
autocomplete="off"
>


<label for="sellerPhone">
Namba ya simu ya muuzaji
</label>

<input
id="sellerPhone"
type="tel"
placeholder="Mfano: 0712345678"
inputmode="tel"
>


<label for="desc">
Maelezo ya bidhaa
</label>

<textarea
id="desc"
rows="4"
placeholder="Andika maelezo ya bidhaa hapa..."
></textarea>


<label for="productImage">
🖼️ Chagua picha ya bidhaa
</label>

<input
id="productImage"
type="file"
accept="image/*"
>


<img
id="imagePreview"
class="image-preview"
alt="Picha ya bidhaa"
>


<button
id="saveProductButton"
class="save-button"
type="button"
onclick="addProduct()"
>
💾 Hifadhi Bidhaa
</button>

</div>

</section>


<!-- ==========================
     ACCOUNT
========================== -->

<section id="account" class="hidden">

<div class="form-box">

<h2>👤 Akaunti</h2>

<div class="account-buttons">

<button
type="button"
onclick="openRegister()"
>
Fungua Akaunti
</button>

<button
type="button"
onclick="openLogin()"
>
Ingia
</button>

</div>


<!-- REGISTER -->

<div
id="registerForm"
class="account-form hidden"
>

<h3>
📝 Fungua Akaunti
</h3>

<label>
Jina kamili
</label>

<input
id="fullName"
type="text"
placeholder="Jina lako kamili"
>


<label>
Namba ya simu
</label>

<input
id="phone"
type="tel"
placeholder="0712345678"
>


<label>
Email
</label>

<input
id="email"
type="email"
placeholder="mfano@email.com"
>


<label>
Password
</label>

<input
id="password"
type="password"
placeholder="Password"
>


<button
class="save-button"
type="button"
onclick="register()"
>
Fungua Akaunti
</button>

</div>


<!-- LOGIN -->

<div
id="loginForm"
class="account-form hidden"
>

<h3>
🔐 Ingia
</h3>

<label>
Email
</label>

<input
id="loginEmail"
type="email"
placeholder="Email"
>


<label>
Password
</label>

<input
id="loginPassword"
type="password"
placeholder="Password"
>


<button
class="save-button"
type="button"
onclick="login()"
>
Ingia
</button>

</div>

</div>

</section>

</main>


<footer>

PLAM TANZANIA © 2026

</footer>


<script>

/* ==========================
   SUPABASE
========================== */

const SUPABASE_URL =
"https://igcgcxkttzeaordqhqqy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9M77SZxUBNK1srWkuGP11w_Y4ES8s8D";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let ps = [];

let selectedCategory = "";


/* ==========================
   SHOW SECTION
========================== */

function show(id){

const sections = [
"home",
"add",
"account"
];

sections.forEach(function(section){

const element =
document.getElementById(section);

if(element){

if(section === id){

element.classList.remove("hidden");

}else{

element.classList.add("hidden");

}

}

});

}


/* ==========================
   OPEN ADD PRODUCT
========================== */

function openAddProduct(){

show("add");

setTimeout(function(){

const nameInput =
document.getElementById("name");

if(nameInput){

nameInput.focus();

}

},100);

}


/* ==========================
   SEARCH
========================== */

function goSearch(){

show("home");

setTimeout(function(){

const search =
document.getElementById("search");

if(search){

search.focus();

}

},100);

}


/* ==========================
   CATEGORY
========================== */

function filterCategory(category){

selectedCategory =
category;

render();

}


/* ==========================
   LOAD PRODUCTS
========================== */

async function loadProducts(){

try{

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/Production?select=*&order=created_at.desc",
{
method:"GET",

headers:{
"apikey":SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY
}

}
);


if(!response.ok){

throw new Error(
"HTTP " + response.status
);

}


ps =
await response.json();

render();


}catch(error){

console.error(
"Load products error:",
error
);

document.getElementById(
"products"
).innerHTML =
"<p>Imeshindikana kupakia bidhaa.</p>";

}

}


/* ==========================
   RENDER PRODUCTS
========================== */

function render(){

const box =
document.getElementById("products");

if(!box){

return;

}


const search =
(
document.getElementById("search")?.value || ""
)
.toLowerCase()
.trim();


const filtered =
ps.filter(function(p){

const text =
(
(p.name || "") +
" " +
(p.category || "") +
" " +
(p.place || "") +
" " +
(p.description || "")
)
.toLowerCase();


const searchMatch =
text.includes(search);


const categoryMatch =
!selectedCategory ||
p.category === selectedCategory;


return searchMatch &&
categoryMatch;

});


if(filtered.length === 0){

box.innerHTML =
"<p>Hakuna bidhaa iliyopatikana.</p>";

return;

}


box.innerHTML =
filtered.map(function(p){

let imageHTML = "";


if(p.image_url){

imageHTML = `

<img
class="product-image"
src="${escapeHTML(p.image_url)}"
alt="${escapeHTML(p.name || "Bidhaa")}"
loading="lazy"
>

`;

}else{

imageHTML = `

<div class="no-image">
📦
</div>

`;

}


const phone =
p.phone || "";


let callButton = "";

let whatsappButton = "";


if(phone){

callButton = `

<button
class="call"
onclick="callSeller('${escapeJS(phone)}')"
>
📞 Piga Simu
</button>

`;


whatsappButton = `

<button
class="whatsapp"
onclick="openWhatsApp(
'${escapeJS(phone)}',
'${escapeJS(p.name || "")}'
)"
>
💬 WhatsApp
</button>

`;

}


return `

<div class="card">

${imageHTML}

<div class="card-body">

<h3>
${escapeHTML(p.name || "Bidhaa")}
</h3>

<div class="price">
TZS ${escapeHTML(p.price || "")}
</div>

<div class="small">
📂 ${escapeHTML(p.category || "")}
</div>

<div class="small">
📍 ${escapeHTML(p.place || "")}
</div>

<div class="small">
${escapeHTML(p.description || "")}
</div>

<div class="card-buttons">

${callButton}

${whatsappButton}

</div>

</div>

</div>

`;

}).join("");

}


/* ==========================
   IMAGE PREVIEW
========================== */

document
.getElementById("productImage")
.addEventListener(
"change",
function(){

const file =
this.files[0];

const preview =
document.getElementById(
"imagePreview"
);


if(!file){

preview.src = "";

preview.style.display =
"none";

return;

}


if(!file.type.startsWith("image/")){

alert(
"Tafadhali chagua picha."
);

this.value = "";

preview.src = "";

preview.style.display =
"none";

return;

}


if(file.size > 5 * 1024 * 1024){

alert(
"Picha isiwe kubwa kuliko 5MB."
);

this.value = "";

preview.src = "";

preview.style.display =
"none";

return;

}


const reader =
new FileReader();


reader.onload =
function(event){

preview.src =
event.target.result;

preview.style.display =
"block";

};


reader.readAsDataURL(file);

});


/* ==========================
   ADD PRODUCT
========================== */

async function addProduct(){

const name =
document.getElementById("name")
.value
.trim();


const price =
document.getElementById("price")
.value
.trim();


const category =
document.getElementById("category")
.value;


const place =
document.getElementById("place")
.value
.trim();


const phone =
document.getElementById("sellerPhone")
.value
.trim();


const description =
document.getElementById("desc")
.value
.trim();


const imageFile =
document.getElementById("productImage")
.files[0];


if(!name){

alert("Andika jina la bidhaa.");

return;

}


if(!price){

alert("Weka bei ya bidhaa.");

return;

}


if(!category){

alert("Chagua kundi la bidhaa.");

return;

}


if(!place){

alert("Andika mahali bidhaa ilipo.");

return;

}


if(!phone){

alert("Weka namba ya simu ya muuzaji.");

return;

}


const button =
document.getElementById(
"saveProductButton"
);


button.disabled = true;

button.innerText =
"⏳ Inahifadhi...";


try{

let imageUrl = null;


/* ==========================
   UPLOAD IMAGE
========================== */

if(imageFile){

const extension =
imageFile.name
.split(".")
.pop()
.toLowerCase();


const filePath =
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"." +
extension;


const upload =
await supabaseClient
.storage
.from("product-images")
.upload(
filePath,
imageFile,
{
cacheControl:"3600",
contentType:imageFile.type,
upsert:false
}
);


if(upload.error){

throw new Error(
"Picha haijapakiwa: " +
upload.error.message
);

}


const publicUrl =
supabaseClient
.storage
.from("product-images")
.getPublicUrl(
filePath
);


imageUrl =
publicUrl.data.publicUrl;

}


/* ==========================
   SAVE DATABASE
========================== */

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/Production",
{
method:"POST",

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify({

name:name,

price:Number(price),

category:category,

place:place,

description:description,

phone:phone,

image_url:imageUrl

})

}
);


if(!response.ok){

const errorText =
await response.text();

throw new Error(
errorText
);

}


alert(
"Bidhaa imehifadhiwa kwenye PLAM! 🎉"
);


/* CLEAR FORM */

document.getElementById("name").value = "";

document.getElementById("price").value = "";

document.getElementById("category").value = "";

document.getElementById("place").value = "";

document.getElementById("sellerPhone").value = "";

document.getElementById("desc").value = "";

document.getElementById("productImage").value = "";

document.getElementById("imagePreview").src = "";

document.getElementById("imagePreview").style.display = "none";


await loadProducts();

show("home");


}catch(error){

console.error(error);

alert(
"Bidhaa haijahifadhiwa.\n\n" +
"Sababu:\n" +
(error.message || error)
);

}finally{

button.disabled = false;

button.innerText =
"💾 Hifadhi Bidhaa";

}

}


/* ==========================
   PHONE FORMAT
========================== */

function formatPhone(phone){

phone =
String(phone || "")
.trim()
.replace(/\s+/g,"")
.replace(/-/g,"");


if(phone.startsWith("+255")){

return phone;

}

if(phone.startsWith("255")){

return "+" + phone;

}

if(phone.startsWith("0")){

return "+255" +
phone.substring(1);

}

return phone;

}


/* ==========================
   CALL SELLER
========================== */

function callSeller(phone){

const number =
formatPhone(phone);

window.location.href =
"tel:" + number;

}


/* ==========================
   WHATSAPP
========================== */

function openWhatsApp(
phone,
productName
){

const number =
formatPhone(phone)
.replace("+","");


const message =
"Habari, nimeiona bidhaa " +
productName +
" kwenye PLAM TANZANIA. Bado inapatikana?";


const url =
"https://wa.me/" +
number +
"?text=" +
encodeURIComponent(message);


window.open(
url,
"_blank"
);

}


/* ==========================
   REGISTER
========================== */

function openRegister(){

document
.getElementById("registerForm")
.classList
.remove("hidden");

document
.getElementById("loginForm")
.classList
.add("hidden");

}


function openLogin(){

document
.getElementById("loginForm")
.classList
.remove("hidden");

document
.getElementById("registerForm")
.classList
.add("hidden");

}


/* ==========================
   REGISTER ACCOUNT
========================== */

async function register(){

const name =
document.getElementById("fullName")
.value
.trim();


const phone =
document.getElementById("phone")
.value
.trim();


const email =
document.getElementById("email")
.value
.trim();


const password =
document.getElementById("password")
.value;


if(
!name ||
!phone ||
!email ||
!password
){

alert(
"Jaza taarifa zote."
);

return;

}


try{

const result =
await supabaseClient
.auth
.signUp({

email:email,

password:password,

options:{
data:{
full_name:name,
phone:phone
}
}

});


if(result.error){

throw result.error;

}


alert(
"Akaunti imefunguliwa! 🎉\n\n" +
"Angalia email yako kwa uthibitisho."
);


}catch(error){

alert(
"Imeshindikana kufungua akaunti:\n" +
error.message
);

}

}


/* ==========================
   LOGIN
========================== */

async function login(){

const email =
document.getElementById("loginEmail")
.value
.trim();


const password =
document.getElementById("loginPassword")
.value;


if(
!email ||
!password
){

alert(
"Weka email na password."
);

return;

}


try{

const result =
await supabaseClient
.auth
.signInWithPassword({

email:email,

password:password

});


if(result.error){

throw result.error;

}


alert(
"Umeingia kwenye akaunti! 🎉"
);


}catch(error){

alert(
"Imeshindikana kuingia:\n" +
error.message
);

}

}


/* ==========================
   SECURITY
========================== */

function escapeHTML(value){

return String(value ?? "")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeJS(value){

return String(value ?? "")

.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,'\\"')
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}


/* ==========================
   START
========================== */

show("home");

loadProducts();

</script>

</body>

</html>
