<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAM TANZANIA</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}
header{background:#0b6b3a;color:#fff;padding:20px}
.wrap{max-width:900px;margin:auto;padding:18px}
.search,input,select,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.cats,.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat,.card,.form{background:#fff;padding:15px;border-radius:14px;box-shadow:0 2px 8px #0001}
.cat{text-align:center}
.pic{height:100px;background:#e9eef0;border-radius:10px;display:grid;place-items:center;font-size:42px}
.price{font-weight:bold;margin:7px 0}
button{padding:12px 16px;border:0;border-radius:10px;background:#0b6b3a;color:#fff}
nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}
nav button{background:none;color:#17202a}
.hidden{display:none}
@media(min-width:650px){.cats{grid-template-columns:repeat(4,1fr)}.products{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<body>

<header>
<div style="font-size:25px;font-weight:bold">🇹🇿 PLAM TANZANIA</div>
<div>Jenga biashara yako. Fikia wateja zaidi.</div>
</header>

<main class="wrap">

<section id="home">
<input id="search" class="search" placeholder="🔍 Tafuta bidhaa au huduma..." oninput="render()">

<h2>📂 Categories</h2>
<div class="cats">
<div class="cat">👕<br>Mavazi</div>
<div class="cat">📱<br>Electronics</div>
<div class="cat">🏠<br>Nyumba</div>
<div class="cat">🚗<br>Magari</div>
<div class="cat">🌾<br>Kilimo</div>
<div class="cat">💄<br>Urembo</div>
<div class="cat">📚<br>Elimu</div>
<div class="cat">🔧<br>Huduma</div>
</div>

<h2>🔥 Bidhaa</h2>
<div id="products" class="products"></div>
</section>

<section id="add" class="hidden">
<h2>➕ Weka Bidhaa Yako</h2>
<div class="form">
<input id="name" placeholder="Jina la bidhaa">
<input id="price" type="number" placeholder="Bei (TSh)">
<select id="category">
<option>Mavazi</option>
<option>Electronics</option>
<option>Nyumba</option>
<option>Magari</option>
<option>Kilimo</option>
<option>Urembo</option>
<option>Elimu</option>
<option>Huduma</option>
</select>
<input id="place" placeholder="Eneo, mfano Mbeya">
<textarea id="desc" placeholder="Maelezo ya bidhaa"></textarea>
<button onclick="add()">Chapisha Bidhaa</button>
</div>
</section>

<section id="account" class="hidden">
<h2>👤 Akaunti</h2>
<div class="form">
<input placeholder="Jina kamili">
<input placeholder="Namba ya simu">
<input type="password" placeholder="Password">
<button onclick="alert('Prototype: akaunti imehifadhiwa!')">Jisajili / Ingia</button>
</div>
</section>

</main>

<nav>
<button onclick="show('home')">🏠<br>Home</button>
<button onclick="show('home');search.focus()">🔍<br>Tafuta</button>
<button onclick="show('add')">➕<br>Weka Bidhaa</button>
<button onclick="alert('Ujumbe wa mnunuzi na muuzaji utaongezwa hapa.')">💬<br>Ujumbe</button>
<button onclick="show('account')">👤<br>Akaunti</button>
</nav>

<script>
// SUPABASE
const SUPABASE_URL = "https://igcgcxkttzeaordqhqqy.supabase.co/rest/v1/;
const SUPABASE_KEY = "sb_publishable_9M77SZxUBNK1srWkuGP11w_Y4ES8s8D";

let ps=[];

async function loadProducts(){
try{
const response=await fetch(
SUPABASE_URL+"/rest/v1/Production?select=*",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}
);

if(!response.ok) throw new Error("Database error");

ps=await response.json();
render();

}catch(error){
console.log(error);
ps=[
["Samsung A05",250000,"Electronics","Mbeya","📱"],
["Viatu vya Michezo",45000,"Mavazi","Mbinga","👟"],
["Sofa Set",650000,"Nyumba","Mbeya","🛋️"],
["Mbegu za Mahindi",12000,"Kilimo","Ruvuma","🌾"]
];
render();
}
}

function render(){
let q=document.getElementById("search").value.toLowerCase();

document.getElementById("products").innerHTML=ps
.filter(p=>
((p.name||p[0]||"")+" "+
(p.category||p[2]||"")+" "+
(p.place||p[3]||""))
.toLowerCase().includes(q)
)
.map(p=>{
let n=p.name||p[0];
let price=p.Price||p[1];
let cat=p.Category||p[2];
let place=p.Place||p[3];
let icon=p[4]||"🛍️";

return `<div class="card">
<div class="pic">${icon}</div>
<b>${n}</b>
<div class="price">TSh ${Number(price).toLocaleString()}</div>
<small>📍 ${place}</small>
<br><br>
<button onclick="alert('Mawasiliano na muuzaji yatafunguliwa hapa.')">
Wasiliana na Muuzaji
</button>
</div>`;
}).join("");
}

async function add(){

let n=document.getElementById("name").value;
let p=document.getElementById("price").value;
let c=document.getElementById("category").value;
let place=document.getElementById("place").value;
let desc=document.getElementById("desc").value;

if(!n||!p||!place){
alert("Jaza jina, bei na eneo.");
return;
}

try{

const response=await fetch(
SUPABASE_URL+"/rest/v1/Production",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Prefer":"return=minimal"
},
body:JSON.stringify({
name:n,
price:Number(p),
category:c,
place:place,
description:desc
})
}
);

if(!response.ok) throw new Error("Haikuweza kuhifadhi");

alert("Bidhaa imehifadhiwa kwenye PLAM! 🎉");

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("place").value="";
document.getElementById("desc").value="";

await loadProducts();
show("home");

}catch(error){
alert("Bidhaa haijahifadhiwa. Hakikisha Supabase RLS policy imeruhusu kuingiza bidhaa.");
console.log(error);
}
}

function show(id){
["home","add","account"].forEach(x=>{
document.getElementById(x).classList.toggle("hidden",x!==id);
});
}

loadProducts();
</script>

</body>
</html>
