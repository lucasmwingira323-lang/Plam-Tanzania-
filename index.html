<!doctype html>
<html lang="sw">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PLAM TANZANIA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f6f8;
color:#222;
}

header{
background:#008000;
color:white;
padding:18px;
text-align:center;
}

header h1{
margin:0;
font-size:28px;
}

header p{
margin:6px 0 0;
}

nav{
display:flex;
justify-content:space-around;
background:white;
padding:10px;
position:sticky;
top:0;
z-index:10;
box-shadow:0 2px 6px #ccc;
}

nav button{
border:0;
background:white;
font-size:14px;
padding:8px;
cursor:pointer;
}

.wrap{
max-width:1000px;
margin:auto;
padding:15px;
}

.search{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
margin-bottom:15px;
}

.categories{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-bottom:20px;
}

.categories button{
padding:12px 5px;
border:0;
border-radius:10px;
background:white;
box-shadow:0 2px 5px #ddd;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 8px #ddd;
}

.product-image{
width:100%;
height:190px;
object-fit:cover;
display:block;
background:#eee;
}

.no-image{
height:190px;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
background:#eee;
}

.card-body{
padding:14px;
}

.card h3{
margin:0 0 8px;
}

.price{
font-weight:bold;
color:#008000;
font-size:18px;
}

.small{
font-size:14px;
color:#666;
margin:5px 0;
}

.card-buttons{
display:flex;
gap:8px;
margin-top:12px;
}

.card-buttons button{
flex:1;
padding:10px 5px;
border:0;
border-radius:8px;
cursor:pointer;
}

.call{
background:#008000;
color:white;
}

.whatsapp{
background:#25D366;
color:white;
}

.hidden{
display:none;
}

.form-box{
background:white;
padding:18px;
border-radius:12px;
box-shadow:0 2px 8px #ddd;
margin-top:15px;
}

.form-box input,
.form-box textarea,
.form-box select{
width:100%;
padding:13px;
margin:7px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

.form-box button{
width:100%;
padding:13px;
border:0;
border-radius:8px;
background:#008000;
color:white;
font-size:16px;
cursor:pointer;
margin-top:8px;
}

.image-preview{
width:100%;
max-height:220px;
object-fit:cover;
border-radius:10px;
margin-top:10px;
display:none;
}

.account-buttons{
display:flex;
gap:10px;
}

.account-buttons button{
flex:1;
}

footer{
text-align:center;
padding:25px;
color:#777;
}

@media(max-width:600px){

.categories{
grid-template-columns:repeat(2,1fr);
}

nav button{
font-size:12px;
}

}

</style>
</head>

<body>

<header>
<h1>🇹🇿 PLAM TANZANIA</h1>
<p>Jenga biashara yako. Fikia wateja zaidi.</p>
</header>

<nav>

<button onclick="show('home')">🏠 Mwanzo</button>

<button onclick="show('home');document.getElementById('search').focus()">
🔍 Tafuta
</button>

<button onclick="openAddProduct()">
➕ Weka Bidhaa
</button>

<button onclick="show('account')">
👤 Akaunti
</button>

</nav>

<main class="wrap">

<!-- HOME -->

<section id="home">

<input
id="search"
class="search"
placeholder="🔍 Tafuta bidhaa au huduma..."
oninput="render()"
>

<div class="categories">

<button onclick="filterCategory('')">🌐 Zote</button>
<button onclick="filterCategory('Mavazi')">👕 Mavazi</button>
<button onclick="filterCategory('Electronics')">📱 Electronics</button>
<button onclick="filterCategory('Nyumba')">🏠 Nyumba</button>
<button onclick="filterCategory('Magari')">🚗 Magari</button>
<button onclick="filterCategory('Kilimo')">🌾 Kilimo</button>
<button onclick="filterCategory('Urembo')">💄 Urembo</button>
<button onclick="filterCategory('Elimu')">📚 Elimu</button>
<button onclick="filterCategory('Huduma')">🛠️ Huduma</button>

</div>

<div id="products" class="products"></div>

</section>


<!-- ADD PRODUCT -->

<section id="add" class="hidden">

<div class="form-box">

<h2>➕ Weka Bidhaa</h2>

<input
id="name"
placeholder="Jina la bidhaa"
>

<input
id="price"
type="number"
placeholder="Bei kwa TZS"
>

<select id="category">

<option value="">Chagua kundi</option>

<option>Mavazi</option>
<option>Electronics</option>
<option>Nyumba</option>
<option>Magari</option>
<option>Kilimo</option>
<option>Urembo</option>
<option>Elimu</option>
<option>Huduma</option>

</select>

<input
id="place"
placeholder="Mahali bidhaa ilipo"
>

<input
id="sellerPhone"
type="tel"
placeholder="Namba ya simu ya muuzaji"
>

<textarea
id="desc"
placeholder="Maelezo ya bidhaa"
rows="4"
></textarea>


<label><b>🖼️ Chagua picha ya bidhaa</b></label>

<input
id="productImage"
type="file"
accept="image/*"
onchange="previewImage(event)"
>

<img
id="imagePreview"
class="image-preview"
>

<button onclick="addProduct()">
💾 Hifadhi Bidhaa
</button>

</div>

</section>


<!-- ACCOUNT -->

<section id="account" class="hidden">

<div class="form-box">

<h2>👤 Akaunti</h2>

<div class="account-buttons">

<button onclick="openRegister()">
Fungua Akaunti
</button>

<button onclick="openLogin()">
Ingia
</button>

</div>

<div id="registerForm" class="hidden">

<h3>📝 Fungua Akaunti</h3>

<input
id="fullName"
placeholder="Jina kamili"
>

<input
id="phone"
type="tel"
placeholder="Namba ya simu"
>

<input
id="email"
type="email"
placeholder="Email"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button onclick="register()">
Fungua Akaunti
</button>

</div>


<div id="loginForm" class="hidden">

<h3>🔐 Ingia</h3>

<input
id="loginEmail"
type="email"
placeholder="Email"
>

<input
id="loginPassword"
type="password"
placeholder="Password"
>

<button onclick="login()">
Ingia
</button>

</div>

</div>

</section>

</main>

<footer>
PLAM TANZANIA © 2026
</footer>


<script>

/* ==============================
SUPABASE
============================== */

const SUPABASE_URL =
"https://igcgcxkttzeaordqhqqy.supabase.co";

const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_YAKO_HAPA";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ==============================
VARIABLES
============================== */

let ps = [];
let selectedCategory = "";


/* ==============================
LOAD PRODUCTS
============================== */

async function loadProducts(){

try{

const response = await fetch(
SUPABASE_URL +
"/rest/v1/Production?select=*&order=created_at.desc",
{
method:"GET",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY
}
}
);

if(!response.ok){

throw new Error(
"HTTP " + response.status
);

}

ps = await response.json();

render();

}catch(error){

console.error(error);

document.getElementById("products").innerHTML =
"<p>Imeshindikana kupakia bidhaa.</p>";

}

}


/* ==============================
RENDER PRODUCTS
============================== */

function render(){

const box =
document.getElementById("products");

const search =
(document.getElementById("search")?.value || "")
.toLowerCase();

const filtered =
ps.filter(p=>{

const text =
(
(p.name || "") + " " +
(p.category || "") + " " +
(p.place || "") + " " +
(p.description || "")
).toLowerCase();

const matchSearch =
text.includes(search);

const matchCategory =
!selectedCategory ||
p.category === selectedCategory;

return matchSearch && matchCategory;

});


if(!filtered.length){

box.innerHTML =
"<p>Hakuna bidhaa iliyopatikana.</p>";

return;

}


box.innerHTML =
filtered.map(p=>{

let imageHTML = "";

if(p.image_url){

imageHTML =
`<img
class="product-image"
src="${escapeHTML(p.image_url)}"
alt="${escapeHTML(p.name || "Bidhaa")}"
loading="lazy"
>`;

}else{

imageHTML =
`<div class="no-image">📦</div>`;

}


const phone =
p.phone || "";

const callButton =
phone
?
`<button
class="call"
onclick="callSeller('${escapeJS(phone)}')">
📞 Piga Simu
</button>`
:
"";


const whatsappButton =
phone
?
`<button
class="whatsapp"
onclick="openWhatsApp(
'${escapeJS(phone)}',
'${escapeJS(p.name || "")}'
)">
💬 WhatsApp
</button>`
:
"";


return `

<div class="card">

${imageHTML}

<div class="card-body">

<h3>
${escapeHTML(p.name || "Bidhaa")}
</h3>

<div class="price">
TZS ${escapeHTML(p.price || "")}
</div>

<div class="small">
📂 ${escapeHTML(p.category || "")}
</div>

<div class="small">
📍 ${escapeHTML(p.place || "")}
</div>

<div class="small">
${escapeHTML(p.description || "")}
</div>

<div class="card-buttons">

${callButton}

${whatsappButton}

</div>

</div>

</div>

`;

}).join("");

}


/* ==============================
CATEGORY
============================== */

function filterCategory(category){

selectedCategory = category;

render();

}


/* ==============================
NAVIGATION
============================== */

function show(id){

[
"home",
"add",
"account"
].forEach(x=>{

const el =
document.getElementById(x);

if(el){

el.classList.toggle(
"hidden",
x !== id
);

}

});

}


function openAddProduct(){

show("add");

document.getElementById("name").focus();

}


function openRegister(){

document
.getElementById("registerForm")
.classList.remove("hidden");

document
.getElementById("loginForm")
.classList.add("hidden");

}


function openLogin(){

document
.getElementById("loginForm")
.classList.remove("hidden");

document
.getElementById("registerForm")
.classList.add("hidden");

}


/* ==============================
IMAGE PREVIEW
============================== */

function previewImage(event){

const file =
event.target.files[0];

const preview =
document.getElementById("imagePreview");

if(!file){

preview.style.display = "none";

return;

}

if(!file.type.startsWith("image/")){

alert("Tafadhali chagua picha.");

event.target.value = "";

preview.style.display = "none";

return;

}

if(file.size > 5 * 1024 * 1024){

alert("Picha isiwe kubwa kuliko 5MB.");

event.target.value = "";

preview.style.display = "none";

return;

}

preview.src =
URL.createObjectURL(file);

preview.style.display = "block";

}


/* ==============================
ADD PRODUCT
============================== */

async function addProduct(){

const name =
document.getElementById("name").value.trim();

const price =
document.getElementById("price").value.trim();

const category =
document.getElementById("category").value;

const place =
document.getElementById("place").value.trim();

const phone =
document.getElementById("sellerPhone").value.trim();

const description =
document.getElementById("desc").value.trim();

const imageFile =
document.getElementById("productImage").files[0];


if(!name || !price || !place || !phone){

alert(
"Jaza jina, bei, mahali na namba ya simu."
);

return;

}


if(Number(price) <= 0){

alert("Weka bei sahihi.");

return;

}


if(phone.length < 9){

alert("Weka namba sahihi ya simu.");

return;

}


const button =
document.querySelector("#add .form-box button");

button.disabled = true;

button.innerText =
"⏳ Inahifadhi...";


try{

let imageUrl = null;


/* ==============================
UPLOAD IMAGE
============================== */

if(imageFile){

const safeName =
imageFile.name
.replace(/[^a-zA-Z0-9._-]/g,"_");

const filePath =
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"-" +
safeName;


const uploadResult =
await supabaseClient
.storage
.from("product-images")
.upload(
filePath,
imageFile,
{
contentType:imageFile.type,
upsert:false
}
);


if(uploadResult.error){

throw uploadResult.error;

}


const publicResult =
supabaseClient
.storage
.from("product-images")
.getPublicUrl(filePath);


imageUrl =
publicResult.data.publicUrl;

}


/* ==============================
SAVE PRODUCT
============================== */

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/Production",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer " + SUPABASE_KEY,
"Content-Type":
"application/json",
"Prefer":
"return=representation"
},

body:JSON.stringify({

name:name,

price:Number(price),

category:category,

place:place,

description:description,

phone:phone,

image_url:imageUrl

})

}
);


if(!response.ok){

const errorText =
await response.text();

throw new Error(errorText);

}


alert(
"Bidhaa imehifadhiwa kwenye PLAM! 🎉"
);


/* ==============================
CLEAR FORM
============================== */

document.getElementById("name").value = "";

document.getElementById("price").value = "";

document.getElementById("category").value = "";

document.getElementById("place").value = "";

document.getElementById("sellerPhone").value = "";

document.getElementById("desc").value = "";

document.getElementById("productImage").value = "";

document.getElementById("imagePreview").style.display =
"none";


await loadProducts();

show("home");


}catch(error){

console.error(error);

alert(
"Bidhaa haijahifadhiwa.\n\n" +
"Sababu: " +
(error.message || error)
);

}finally{

button.disabled = false;

button.innerText =
"💾 Hifadhi Bidhaa";

}

}


/* ==============================
PHONE
============================== */

function formatPhone(phone){

phone =
String(phone || "")
.trim()
.replace(/\s+/g,"")
.replace(/-/g,"");


if(phone.startsWith("+255")){

return phone;

}

if(phone.startsWith("255")){

return "+" + phone;

}

if(phone.startsWith("0")){

return "+255" + phone.substring(1);

}

return phone;

}


function callSeller(phone){

const number =
formatPhone(phone);

window.location.href =
"tel:" + number;

}


function openWhatsApp(
phone,
productName
){

const number =
formatPhone(phone)
.replace("+","");


const message =
"Habari, nimeiona bidhaa " +
productName +
" kwenye PLAM TANZANIA. Bado inapatikana?";


const url =
"https://wa.me/" +
number +
"?text=" +
encodeURIComponent(message);


window.open(
url,
"_blank"
);

}


/* ==============================
ACCOUNT
============================== */

async function register(){

const name =
document.getElementById("fullName").value.trim();

const phone =
document.getElementById("phone").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;


if(!name || !phone || !email || !password){

alert("Jaza taarifa zote.");

return;

}


try{

const {
data,
error
} =
await supabaseClient.auth.signUp({

email:email,

password:password,

options:{
data:{
full_name:name,
phone:phone
}
}

});


if(error){

throw error;

}

alert(
"Akaunti imefunguliwa! 🎉\n" +
"Angalia email yako kwa uthibitisho kama umeombwa."
);

}catch(error){

alert(
"Imeshindikana kufungua akaunti:\n" +
error.message
);

}

}


async function login(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;


if(!email || !password){

alert(
"Weka email na password."
);

return;

}


try{

const {
data,
error
} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(error){

throw error;

}

alert(
"Umeingia kwenye akaunti! 🎉"
);

}catch(error){

alert(
"Imeshindikana kuingia:\n" +
error.message
);

}

}


/* ==============================
SECURITY
============================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeJS(value){

return String(value ?? "")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,'\\"')
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}


/* ==============================
START
============================== */

loadProducts();

</script>

</body>
</html>
