

<!doctype html>
<html lang="sw">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PLAM TANZANIA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f6f8;
color:#17202a;
padding-bottom:75px;
}

header{
background:#0b6b3a;
color:#fff;
padding:20px;
}

header .title{
font-size:25px;
font-weight:bold;
}

header .subtitle{
margin-top:5px;
}

.wrap{
max-width:900px;
margin:auto;
padding:18px;
}

.search,
input,
select,
textarea{
width:100%;
padding:13px;
margin:8px 0;
border:1px solid #ddd;
border-radius:10px;
box-sizing:border-box;
font-size:16px;
}

.cats,
.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.cat,
.card,
.form{
background:#fff;
padding:15px;
border-radius:14px;
box-shadow:0 2px 8px #0001;
}

.cat{
text-align:center;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.cat .icon{
font-size:35px;
display:block;
margin-bottom:5px;
}

.card{
overflow:hidden;
}

.pic{
height:100px;
background:#e9eef0;
border-radius:10px;
display:grid;
place-items:center;
font-size:42px;
}

.price{
font-weight:bold;
font-size:18px;
margin:7px 0;
color:#0b6b3a;
}

button{
padding:12px 16px;
border:0;
border-radius:10px;
background:#0b6b3a;
color:#fff;
font-size:15px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.top-buttons{
text-align:center;
padding:15px;
background:#fff;
}

.top-buttons button{
margin:3px;
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#fff;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
padding:8px;
z-index:100;
}

nav button{
background:none;
color:#17202a;
font-size:13px;
padding:6px;
}

.hidden{
display:none !important;
}

h2{
margin-top:25px;
}

.message{
background:#fff;
padding:15px;
border-radius:12px;
text-align:center;
}

@media(min-width:650px){

.cats{
grid-template-columns:repeat(4,1fr);
}

.products{
grid-template-columns:repeat(3,1fr);
}

}

</style>

</head>


<body>


<header>

<div class="title">
🇹🇿 PLAM TANZANIA
</div>

<div class="subtitle">
Jenga biashara yako. Fikia wateja zaidi.
</div>

</header>


<div class="top-buttons">

<button onclick="show('account')">
Fungua Akaunti
</button>

<button onclick="show('account')">
Ingia
</button>

</div>


<main class="wrap">


<!-- ================= HOME ================= -->

<section id="home">

<input
id="search"
class="search"
placeholder="🔍 Tafuta bidhaa au huduma..."
oninput="render()"
>


<h2>
📂 Categories
</h2>


<div class="cats">


<div class="cat" onclick="filterCategory('Mavazi')">
<span class="icon">👕</span>
Mavazi
</div>


<div class="cat" onclick="filterCategory('Electronics')">
<span class="icon">📱</span>
Electronics
</div>


<div class="cat" onclick="filterCategory('Nyumba')">
<span class="icon">🏠</span>
Nyumba
</div>


<div class="cat" onclick="filterCategory('Magari')">
<span class="icon">🚗</span>
Magari
</div>


<div class="cat" onclick="filterCategory('Kilimo')">
<span class="icon">🌾</span>
Kilimo
</div>


<div class="cat" onclick="filterCategory('Urembo')">
<span class="icon">💄</span>
Urembo
</div>


<div class="cat" onclick="filterCategory('Elimu')">
<span class="icon">📚</span>
Elimu
</div>


<div class="cat" onclick="filterCategory('Huduma')">
<span class="icon">🔧</span>
Huduma
</div>


</div>


<h2>
🔥 Bidhaa
</h2>


<div id="products" class="products"></div>


</section>



<!-- ================= ADD PRODUCT ================= -->

<section id="add" class="hidden">

<h2>
➕ Weka Bidhaa Yako
</h2>


<div class="form">


<input
id="name"
placeholder="Jina la bidhaa"
>


<input
id="price"
type="number"
placeholder="Bei (TSh)"
>


<select id="category">

<option>Mavazi</option>
<option>Electronics</option>
<option>Nyumba</option>
<option>Magari</option>
<option>Kilimo</option>
<option>Urembo</option>
<option>Elimu</option>
<option>Huduma</option>

</select>


<input
id="place"
placeholder="Eneo, mfano Mbeya"
>


<textarea
id="desc"
placeholder="Maelezo ya bidhaa">
</textarea>


<button onclick="add()">
Chapisha Bidhaa
</button>


</div>

</section>



<!-- ================= ACCOUNT ================= -->

<section id="account" class="hidden">

<h2>
👤 Akaunti
</h2>


<div class="form">


<input
id="fullName"
placeholder="Jina kamili"
>


<input
id="phone"
placeholder="Namba ya simu"
>


<input
id="email"
type="email"
placeholder="Barua pepe"
>


<input
id="password"
type="password"
placeholder="Password"
>


<button onclick="registerUser()">
Jisajili
</button>


</div>

</section>


</main>



<!-- ================= NAVIGATION ================= -->

<nav>

<button onclick="show('home')">
🏠<br>
Home
</button>


<button onclick="show('home');document.getElementById('search').focus()">
🔍<br>
Tafuta
</button>


<button onclick="show('add')">
➕<br>
Weka Bidhaa
</button>


<button onclick="alert('Ujumbe wa mnunuzi na muuzaji utaongezwa hapa.')">
💬<br>
Ujumbe
</button>


<button onclick="show('account')">
👤<br>
Akaunti
</button>

</nav>



<script>


// ======================================
// SUPABASE
// ======================================

const SUPABASE_URL =
"https://igcgcxkttzeaordqhqqy.supabase.co";


const SUPABASE_KEY =
"sb_publishable_9M77SZxUBNK1srWkuGP11w_Y4ES8s8D";


const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let ps = [];


// ======================================
// LOAD PRODUCTS
// ======================================

async function loadProducts(){

try{

const response = await fetch(

SUPABASE_URL +
"/rest/v1/Production?select=*",

{

method:"GET",

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY

}

}

);


if(!response.ok){

const error =
await response.text();

console.log(
"Supabase error:",
error
);

throw new Error(
"Database error"
);

}


ps =
await response.json();


render();


}catch(error){

console.log(
"Load products error:",
error
);


// Sample products ikiwa database
// haijapatikana

ps = [

{
name:"Samsung A05",
price:250000,
category:"Electronics",
place:"Mbeya",
icon:"📱"
},

{
name:"Viatu vya Michezo",
price:45000,
category:"Mavazi",
place:"Mbinga",
icon:"👟"
},

{
name:"Sofa Set",
price:650000,
category:"Nyumba",
place:"Mbeya",
icon:"🛋️"
},

{
name:"Mbegu za Mahindi",
price:12000,
category:"Kilimo",
place:"Ruvuma",
icon:"🌾"
}

];


render();

}

}


// ======================================
// RENDER PRODUCTS
// ======================================

function render(){

const box =
document.getElementById("products");


const search =
document.getElementById("search")
.value
.toLowerCase()
.trim();


const filtered =
ps.filter(product => {

const name =
String(product.name || "")
.toLowerCase();

const category =
String(product.category || "")
.toLowerCase();

const place =
String(product.place || "")
.toLowerCase();

const description =
String(product.description || "")
.toLowerCase();


return (

name.includes(search) ||

category.includes(search) ||

place.includes(search) ||

description.includes(search)

);

});


if(filtered.length === 0){

box.innerHTML =

"<div class='message'>" +
"Hakuna bidhaa zilizopatikana." +
"</div>";

return;

}


box.innerHTML =

filtered.map(product => {

const icon =
product.icon || "🛍️";


const price =
Number(product.price || 0)
.toLocaleString();


return `

<div class="card">

<div class="pic">
${icon}
</div>

<h3>
${product.name || ""}
</h3>

<div class="price">
TSh ${price}
</div>

<div>
📂 ${product.category || ""}
</div>

<div>
📍 ${product.place || ""}
</div>

<p>
${product.description || ""}
</p>

<button
onclick="contactSeller('${product.name || ""}')">

Wasiliana na Muuzaji

</button>

</div>

`;

}).join("");

}


// ======================================
// FILTER CATEGORY
// ======================================

function filterCategory(category){

document.getElementById("search").value =
category;

show("home");

render();

}


// ======================================
// CONTACT SELLER
// ======================================

function contactSeller(productName){

alert(
"Mawasiliano na muuzaji wa " +
productName +
" yatafunguliwa hapa."
);

}


// ======================================
// ADD PRODUCT
// ======================================

async function add(){

const name =
document.getElementById("name")
.value
.trim();


const price =
document.getElementById("price")
.value
.trim();


const category =
document.getElementById("category")
.value;


const place =
document.getElementById("place")
.value
.trim();


const description =
document.getElementById("desc")
.value
.trim();


if(!name || !price || !place){

alert(
"Jaza jina, bei na eneo."
);

return;

}


try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/Production",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

name:name,

price:Number(price),

category:category,

place:place,

description:description

})

}

);


if(!response.ok){

const error =
await response.text();

console.log(
"Supabase insert error:",
error
);

throw new Error(error);

}


alert(
"🎉 Bidhaa imehifadhiwa kwenye PLAM!"
);


document.getElementById("name")
.value="";


document.getElementById("price")
.value="";


document.getElementById("place")
.value="";


document.getElementById("desc")
.value="";


await loadProducts();


show("home");


}catch(error){

console.log(
"ADD PRODUCT ERROR:",
error
);


alert(
"Bidhaa haijahifadhiwa: " +
(error.message ||
"Kuna kosa.")
);

}

}


// ======================================
// NAVIGATION
// ======================================

function show(id){

["home","add","account"].forEach(x => {

document
.getElementById(x)
.classList
.toggle(
"hidden",
x !== id
);

});

}


// ======================================
// REGISTER USER
// ======================================

async function registerUser(){

const fullName =
document.getElementById("fullName")
.value
.trim();


const phone =
document.getElementById("phone")
.value
.trim();


const email =
document.getElementById("email")
.value
.trim();


const password =
document.getElementById("password")
.value;


if(
!fullName ||
!phone ||
!email ||
!password
){

alert(
"Tafadhali jaza taarifa zote."
);

return;

}


if(password.length < 6){

alert(
"Password iwe na angalau herufi 6."
);

return;

}


const {
data,
error
} =
await supabase.auth.signUp({

email:email,

password:password,

options:{

data:{

full_name:
fullName,

phone:
phone

}

}

});


if(error){

alert(
"Usajili umeshindikana: " +
error.message
);

return;

}


console.log(
"Registered user:",
data
);


alert(
"✅ Akaunti imefunguliwa! " +
"Angalia email yako kwa uthibitisho."
);

}


// ======================================
// START
// ======================================

loadProducts();


</script>

</body>

</html>
