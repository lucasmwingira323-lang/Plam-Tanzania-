<script>


/* ==================================================
SUPABASE
================================================== */

const SUPABASE_URL =
"https://igcgcxkttzeaordqhqqy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9M77SZxUBNK1srWkuGP11w_Y4ES8s8D";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let ps = [];

let selectedCategory = "";

let currentUser = null;

let editingProductId = null;


/* ==================================================
AUTH HEADERS
================================================== */

async function getAuthHeaders(){

const result =
await supabaseClient.auth.getSession();


if(result.error){

throw new Error(
result.error.message
);

}


const session =
result.data.session;


if(
!session ||
!session.access_token
){

throw new Error(
"Session ya akaunti haijapatikana. Tafadhali ingia tena."
);

}


return {

apikey:SUPABASE_KEY,

Authorization:
"Bearer " +
session.access_token,

"Content-Type":
"application/json"

};

}


/* ==================================================
SHOW
================================================== */

function show(id){

[
"home",
"add",
"account"
].forEach(function(section){

const element =
document.getElementById(section);

if(element){

element.classList.toggle(
"hidden",
section !== id
);

}

});

}

OPEN ADD PRODUCT

/* ==================================================

/* ==================================================
CATEGORY
================================================== */

function filterCategory(category){

/* ==================================================
LOAD PRODUCTS
================================================== */

async function loadProducts(){

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/Production?select=*&order=created_at.desc",

{

method:"GET",

headers:{

apikey:SUPABASE_KEY,

Authorization:
"Bearer " +
SUPABASE_KEY

}

}

);


if(!response.ok){

const errorText =
await response.text();

throw new Error(
"HTTP " +
response.status +
": " +
errorText
);

}


ps =
await response.json();


render();


}catch(error){

console.error(
"LOAD PRODUCTS ERROR:",
error
);


document.getElementById(
"products"
).innerHTML =

"<p>Imeshindikana kupakia bidhaa.</p>";

}

}


/* ==================================================
RENDER
================================================== */

function render(){

const box =
document.getElementById(
"products"
);

if(!box)return;


const search =
(
document.getElementById(
"search"
)?.value || ""
)
.toLowerCase()
.trim();


const filtered =
ps.filter(function(p){

const text =

(
(p.name || "") +
" " +
(p.category || "") +
" " +
(p.place || "") +
" " +
(p.description || "")
)
.toLowerCase();


return(

text.includes(search)

&&

(
!selectedCategory ||
p.category === selectedCategory
)

);

});


if(filtered.length === 0){

box.innerHTML =
"<p>Hakuna bidhaa iliyopatikana.</p>";

return;

}


box.innerHTML =

filtered.map(function(p){

let imageHTML = "";


if(
p.image_url &&
p.image_url_2
){

imageHTML = `

<div class="gallery">

<div>

<img
src="${escapeHTML(p.image_url)}"
alt="Mbele"
loading="lazy"
>

<div class="image-label">
Mbele
</div>

</div>


<div>

<img
src="${escapeHTML(p.image_url_2)}"
alt="Nyuma"
loading="lazy"
>

<div class="image-label">
Nyuma
</div>

</div>

</div>

`;

}

else if(p.image_url){

imageHTML = `

<img
class="single-image"
src="${escapeHTML(p.image_url)}"
alt="${escapeHTML(
p.name || "Bidhaa"
)}"
loading="lazy"
>

`;

}

else{

imageHTML =
`<div class="no-image">📦</div>`;

}


const phone =
p.phone || "";


let buttons = "";


if(phone){

buttons = `

<button
class="call"
onclick="callSeller(
'${escapeJS(phone)}'
)"
>

📞 Piga Simu

</button>


<button
class="whatsapp"
onclick="openWhatsApp(
'${escapeJS(phone)}',
'${escapeJS(p.name || "")}'
)"
>

💬 WhatsApp

</button>

`;

}


return `

<div class="card">

${imageHTML}


<div class="card-body">

<h3>

${escapeHTML(
p.name || "Bidhaa"
)}

</h3>


<div class="price">

TZS ${escapeHTML(
p.price || ""
)}

</div>


<div class="small">

📂 ${escapeHTML(
p.category || ""
)}

</div>


<div class="small">

📍 ${escapeHTML(
p.place || ""
)}

</div>


<div class="small">

${escapeHTML(
p.description || ""
)}

</div>


<div class="card-buttons">

${buttons}

</div>

</div>

</div>

`;

}).join("");

}


/* ==================================================
IMAGE SELECT
================================================== */

function handleImageSelect(
inputId,
statusId
){

const input =
document.getElementById(
inputId
);

const status =
document.getElementById(
statusId
);


if(!input || !status)return;


const file =
input.files &&
input.files.length
?
input.files[0]
:
null;


if(!file){

status.style.display =
"none";

status.innerText =
"";

return;

}


/* SIZE */

if(
file.size >
5 * 1024 * 1024
){

alert(
"Picha isiwe kubwa kuliko 5MB."
);

input.value = "";

status.style.display =
"none";

status.innerText =
"";

return;

}


/* TYPE */

const allowedTypes = [

"image/jpeg",

"image/png",

"image/webp"

];


if(
!allowedTypes.includes(
file.type
)
){

alert(
"Picha hii haitumiki. Chagua picha ya JPG, PNG au WEBP."
);

input.value = "";

status.style.display =
"none";

status.innerText =
"";

return;

}


status.innerText =

"✅ Picha imechaguliwa: " +
file.name +
" (" +
Math.round(
file.size / 1024
) +
" KB)";


status.style.display =
"block";

}


/* ==================================================
IMAGE INPUT EVENTS
================================================== */

document
.getElementById(
"productImage1"
)
.addEventListener(
"change",
function(){

handleImageSelect(
"productImage1",
"imageStatus1"
);

}
);


document
.getElementById(
"productImage2"
)
.addEventListener(
"change",
function(){

handleImageSelect(
"productImage2",
"imageStatus2"
);

}
);


/* ==================================================
UPLOAD IMAGE
================================================== */

async function uploadImage(file){

if(!file){

return null;

}


if(
file.size >
5 * 1024 * 1024
){

throw new Error(
"Picha ni kubwa kuliko 5MB."
);

}


const allowedTypes = [

"image/jpeg",

"image/png",

"image/webp"

];


if(
!allowedTypes.includes(
file.type
)
){

throw new Error(
"Chagua picha ya JPG, PNG au WEBP."
);

}


const extensionMap = {

"image/jpeg":"jpg",

"image/png":"png",

"image/webp":"webp"

};


const extension =
extensionMap[file.type];


const filePath =

Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"." +
extension;


console.log(
"UPLOAD FILE:",
file.name,
file.type,
file.size
);


const upload =
await supabaseClient
.storage
.from(
"product-images"
)
.upload(

filePath,

file,

{

cacheControl:"3600",

contentType:
file.type,

upsert:false

}

);


if(upload.error){

console.error(
"STORAGE ERROR:",
upload.error
);

throw new Error(
upload.error.message ||
"Supabase imeshindwa kupakia picha."
);

}


const publicUrl =
supabaseClient
.storage
.from(
"product-images"
)
.getPublicUrl(
filePath
);


if(
!publicUrl.data ||
!publicUrl.data.publicUrl
){

throw new Error(
"Public URL ya picha haijapatikana."
);

}


return
publicUrl.data.publicUrl;

}

/* ==================================================
PHONE FORMAT
================================================== */

function formatPhone(phone){

phone =
String(phone || "")
.trim()
.replace(/\s+/g,"")
.replace(/-/g,"");


if(
phone.startsWith("+255")
)
return phone;


if(
phone.startsWith("255")
)
return "+" + phone;


if(
phone.startsWith("0")
)
return "+255" +
phone.substring(1);


return phone;

}

/* ==================================================
ESCAPE HTML
================================================== */

function escapeHTML(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* ==================================================
ESCAPE JS
================================================== */

function escapeJS(value){

return String(
value ?? ""
)

.replace(
/\\/g,
"\\\\"
)

.replace(
/'/g,
"\\'"
)

.replace(
/"/g,
'\\"'
)

.replace(
/\n/g,
"\\n"
)

.replace(
/\r/g,
"\\r"
);

}
