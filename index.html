<!doctype html>
<html lang="sw">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PLAM TANZANIA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f6f8;
color:#222;
}

header{
background:#008000;
color:white;
padding:18px;
text-align:center;
}

header h1{
margin:0;
font-size:28px;
}

header p{
margin:6px 0 0;
}

nav{
display:flex;
justify-content:space-around;
background:white;
padding:10px;
position:sticky;
top:0;
z-index:10;
box-shadow:0 2px 6px #ccc;
}

nav button{
border:0;
background:white;
font-size:14px;
padding:8px;
cursor:pointer;
}

.wrap{
max-width:1000px;
margin:auto;
padding:15px;
}

.search{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
margin-bottom:15px;
}

.categories{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-bottom:20px;
}

.categories button{
padding:12px 5px;
border:0;
border-radius:10px;
background:white;
box-shadow:0 2px 5px #ddd;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:1fr;
gap:15px;
}

.card{
width:100%;
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 8px #ddd;
}

.product-image{
width:100%;
max-height:500px;
display:block;
object-fit:contain;
background:#eee;
}

.no-image{
width:100%;
height:220px;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
background:#eee;
}

.card-body{
padding:14px;
}

.card h3{
margin:0 0 8px;
}

.price{
font-weight:bold;
color:#008000;
font-size:18px;
}

.small{
font-size:14px;
color:#666;
margin:5px 0;
}

.card-buttons{
display:flex;
gap:8px;
margin-top:12px;
}

.card-buttons button{
flex:1;
padding:10px 5px;
border:0;
border-radius:8px;
cursor:pointer;
}

.call{
background:#008000;
color:white;
}

.whatsapp{
background:#25D366;
color:white;
}

.hidden{
display:none !important;
}

.form-box{
background:white;
padding:18px;
border-radius:12px;
box-shadow:0 2px 8px #ddd;
margin-top:15px;
}

.form-box input,
.form-box textarea,
.form-box select{
display:block;
width:100%;
padding:13px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
background:white;
color:#222;
}

.form-box input:focus,
.form-box textarea:focus,
.form-box select:focus{
outline:none;
border:2px solid #008000;
}

.form-box input[type="file"]{
padding:10px;
cursor:pointer;
}

.form-box button{
width:100%;
padding:13px;
border:0;
border-radius:8px;
background:#008000;
color:white;
font-size:16px;
cursor:pointer;
margin-top:8px;
}

.form-box button:disabled{
background:#777;
cursor:not-allowed;
}

.image-preview{
width:100%;
max-height:350px;
object-fit:contain;
border-radius:10px;
margin-top:10px;
display:none;
background:#eee;
border:1px solid #ddd;
}

.account-buttons{
display:flex;
gap:10px;
}

.account-buttons button{
flex:1;
}

footer{
text-align:center;
padding:25px;
color:#777;
}

@media(max-width:600px){

.categories{
grid-template-columns:repeat(2,1fr);
}

nav button{
font-size:12px;
}

.products{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header>

<h1>🇹🇿 PLAM TANZANIA</h1>

<p>
Jenga biashara yako. Fikia wateja zaidi.
</p>

</header>


<nav>

<button onclick="show('home')">
🏠 Mwanzo
</button>

<button onclick="show('home');focusSearch()">
🔍 Tafuta
</button>

<button onclick="openAddProduct()">
➕ Weka Bidhaa
</button>

<button onclick="show('account')">
👤 Akaunti
</button>

</nav>


<main class="wrap">


<!-- =========================
     HOME
========================= -->

<section id="home">

<input
id="search"
class="search"
placeholder="🔍 Tafuta bidhaa au huduma..."
oninput="render()"
>

<div class="categories">

<button onclick="filterCategory('')">
🌐 Zote
</button>

<button onclick="filterCategory('Mavazi')">
👕 Mavazi
</button>

<button onclick="filterCategory('Electronics')">
📱 Electronics
</button>

<button onclick="filterCategory('Nyumba')">
🏠 Nyumba
</button>

<button onclick="filterCategory('Magari')">
🚗 Magari
</button>

<button onclick="filterCategory('Kilimo')">
🌾 Kilimo
</button>

<button onclick="filterCategory('Urembo')">
💄 Urembo
</button>

<button onclick="filterCategory('Elimu')">
📚 Elimu
</button>

<button onclick="filterCategory('Huduma')">
🛠️ Huduma
</button>

</div>

<div id="products" class="products"></div>

</section>


<!-- =========================
     ADD PRODUCT
========================= -->

<section id="add" class="hidden">

<div class="form-box">

<h2>➕ Weka Bidhaa</h2>


<label>Jina la bidhaa</label>

<input
id="name"
type="text"
placeholder="Mfano: Samsung A05"
autocomplete="off"
>


<label>Bei</label>

<input
id="price"
type="number"
placeholder="Bei kwa TZS"
inputmode="numeric"
>


<label>Kundi la bidhaa</label>

<select id="category">

<option value="">
Chagua kundi
</option>

<option value="Mavazi">
Mavazi
</option>

<option value="Electronics">
Electronics
</option>

<option value="Nyumba">
Nyumba
</option>

<option value="Magari">
Magari
</option>

<option value="Kilimo">
Kilimo
</option>

<option value="Urembo">
Urembo
</option>

<option value="Elimu">
Elimu
</option>

<option value="Huduma">
Huduma
</option>

</select>


<label>Mahali bidhaa ilipo</label>

<input
id="place"
type="text"
placeholder="Mfano: Mbeya"
autocomplete="off"
>


<label>Namba ya simu ya muuzaji</label>

<input
id="sellerPhone"
type="tel"
placeholder="Mfano: 0712345678"
inputmode="tel"
autocomplete="tel"
>


<label>Maelezo ya bidhaa</label>

<textarea
id="desc"
placeholder="Andika maelezo ya bidhaa..."
rows="4"
></textarea>


<label>
<b>🖼️ Chagua picha ya bidhaa</b>
</label>

<input
id="productImage"
type="file"
accept="image/jpeg,image/png,image/webp"
>


<img
id="imagePreview"
class="image-preview"
alt="Preview ya bidhaa"
>


<button
id="saveProductButton"
type="button"
onclick="addProduct()"
>
💾 Hifadhi Bidhaa
</button>

</div>

</section>


<!-- =========================
     ACCOUNT
========================= -->

<section id="account" class="hidden">

<div class="form-box">

<h2>👤 Akaunti</h2>

<div class="account-buttons">

<button
type="button"
onclick="openRegister()"
>
Fungua Akaunti
</button>

<button
type="button"
onclick="openLogin()"
>
Ingia
</button>

</div>


<div id="registerForm" class="hidden">

<h3>📝 Fungua Akaunti</h3>

<input
id="fullName"
type="text"
placeholder="Jina kamili"
>

<input
id="phone"
type="tel"
placeholder="Namba ya simu"
>

<input
id="email"
type="email"
placeholder="Email"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button
type="button"
onclick="register()"
>
Fungua Akaunti
</button>

</div>


<div id="loginForm" class="hidden">

<h3>🔐 Ingia</h3>

<input
id="loginEmail"
type="email"
placeholder="Email"
>

<input
id="loginPassword"
type="password"
placeholder="Password"
>

<button
type="button"
onclick="login()"
>
Ingia
</button>

</div>

</div>

</section>

</main>


<footer>

PLAM TANZANIA © 2026

</footer>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://igcgcxkttzeaordqhqqy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9M77SZxUBNK1srWkuGP11w_Y4ES8s8D";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let ps = [];

let selectedCategory = "";


/* ==============================
   LOAD PRODUCTS
============================== */

async function loadProducts(){

try{

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/Production?select=*&order=created_at.desc",
{
method:"GET",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY
}

}
);


if(!response.ok){

throw new Error(
"HTTP " + response.status
);

}


ps =
await response.json();

render();


}catch(error){

console.error(
"Load products error:",
error
);

document.getElementById(
"products"
).innerHTML =
"<p>Imeshindikana kupakia bidhaa.</p>";

}

}


/* ==============================
   RENDER
============================== */

function render(){

const box =
document.getElementById("products");

const search =
(
document.getElementById("search")?.value || ""
)
.toLowerCase()
.trim();


const filtered =
ps.filter(p=>{

const text =
(
(p.name || "") +
" " +
(p.category || "") +
" " +
(p.place || "") +
" " +
(p.description || "")
)
.toLowerCase();


return (
text.includes(search) &&
(
!selectedCategory ||
p.category === selectedCategory
)
);

});


if(!filtered.length){

box.innerHTML =
"<p>Hakuna bidhaa iliyopatikana.</p>";

return;

}


box.innerHTML =
filtered.map(p=>{

let imageHTML = "";


if(p.image_url){

imageHTML = `

<img
class="product-image"
src="${escapeHTML(p.image_url)}"
alt="${escapeHTML(p.name || "Bidhaa")}"
loading="lazy"
>

`;

}else{

imageHTML = `

<div class="no-image">
📦
</div>

`;

}


const phone =
p.phone || "";


const callButton =
phone
?
`

<button
class="call"
onclick="callSeller('${escapeJS(phone)}')"
>
📞 Piga Simu
</button>

`
:
"";


const whatsappButton =
phone
?
`

<button
class="whatsapp"
onclick="openWhatsApp(
'${escapeJS(phone)}',
'${escapeJS(p.name || "")}'
)"
>
💬 WhatsApp
</button>

`
:
"";


return `

<div class="card">

${imageHTML}

<div class="card-body">

<h3>
${escapeHTML(p.name || "Bidhaa")}
</h3>

<div class="price">
TZS ${escapeHTML(p.price || "")}
</div>

<div class="small">
📂 ${escapeHTML(p.category || "")}
</div>

<div class="small">
📍 ${escapeHTML(p.place || "")}
</div>

<div class="small">
${escapeHTML(p.description || "")}
</div>

<div class="card-buttons">

${callButton}

${whatsappButton}

</div>

</div>

</div>

`;

}).join("");

}


/* ==============================
   CATEGORY
============================== */

function filterCategory(category){

selectedCategory =
category;

render();

}


/* ==============================
   SHOW
============================== */

function show(id){

[
"home",
"add",
"account"
]
.forEach(x=>{

const el =
document.getElementById(x);

if(el){

el.classList.toggle(
"hidden",
x !== id
);

}

});

}


/* ==============================
   SEARCH
============================== */

function focusSearch(){

const search =
document.getElementById("search");

if(search){

search.focus();

}

}


/* ==============================
   ADD PRODUCT
============================== */

function openAddProduct(){

show("add");

setTimeout(()=>{

const name =
document.getElementById("name");

if(name){

name.focus();

}

},100);

}


/* ==============================
   ACCOUNT
============================== */

function openRegister(){

document
.getElementById("registerForm")
.classList
.remove("hidden");

document
.getElementById("loginForm")
.classList
.add("hidden");

}


function openLogin(){

document
.getElementById("loginForm")
.classList
.remove("hidden");

document
.getElementById("registerForm")
.classList
.add("hidden");

}


/* ==============================
   IMAGE PREVIEW
============================== */

document
.getElementById("productImage")
.addEventListener(
"change",
function(){

const file =
this.files[0];

const preview =
document.getElementById(
"imagePreview"
);


if(!file){

preview.src = "";

preview.style.display =
"none";

return;

}


if(!file.type.startsWith("image/")){

alert(
"Tafadhali chagua picha sahihi."
);

this.value = "";

preview.src = "";

preview.style.display =
"none";

return;

}


if(file.size > 5 * 1024 * 1024){

alert(
"Picha isiwe kubwa kuliko 5MB."
);

this.value = "";

preview.src = "";

preview.style.display =
"none";

return;

}


const reader =
new FileReader();


reader.onload =
function(e){

preview.src =
e.target.result;

preview.style.display =
"block";

};


reader.readAsDataURL(file);

});


/* ==============================
   SAVE PRODUCT
============================== */

async function addProduct(){

const name =
document
.getElementById("name")
.value
.trim();


const price =
document
.getElementById("price")
.value
.trim();


const category =
document
.getElementById("category")
.value;


const place =
document
.getElementById("place")
.value
.trim();


const phone =
document
.getElementById("sellerPhone")
.value
.trim();


const description =
document
.getElementById("desc")
.value
.trim();


const imageFile =
document
.getElementById("productImage")
.files[0];


if(!name){

alert("Andika jina la bidhaa.");

document.getElementById("name").focus();

return;

}


if(!price){

alert("Weka bei ya bidhaa.");

document.getElementById("price").focus();

return;

}


if(Number(price) <= 0){

alert("Weka bei sahihi.");

return;

}


if(!category){

alert("Chagua kundi la bidhaa.");

document.getElementById("category").focus();

return;

}


if(!place){

alert("Andika mahali bidhaa ilipo.");

document.getElementById("place").focus();

return;

}


if(!phone){

alert("Weka namba ya simu ya muuzaji.");

document.getElementById("sellerPhone").focus();

return;

}


const button =
document.getElementById(
"saveProductButton"
);


button.disabled = true;

button.innerText =
"⏳ Inahifadhi...";


try{

let imageUrl = null;


/* ==============================
   UPLOAD IMAGE
============================== */

if(imageFile){

const extension =
imageFile.name
.split(".")
.pop()
.toLowerCase();


const filePath =
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"." +
extension;


const uploadResult =
await supabaseClient
.storage
.from("product-images")
.upload(
filePath,
imageFile,
{
cacheControl:"3600",
contentType:imageFile.type,
upsert:false
}
);


if(uploadResult.error){

throw new Error(
"Picha haijapakiwa: " +
uploadResult.error.message
);

}


const publicResult =
supabaseClient
.storage
.from("product-images")
.getPublicUrl(
filePath
);


imageUrl =
publicResult
.data
.publicUrl;

}


/* ==============================
   SAVE DATABASE
============================== */

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/Production",
{
method:"POST",

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify({

name:name,

price:Number(price),

category:category,

place:place,

description:description,

phone:phone,

image_url:imageUrl

})

}
);


if(!response.ok){

const errorText =
await response.text();

throw new Error(
"Database error: " +
errorText
);

}


alert(
"Bidhaa imehifadhiwa kwenye PLAM! 🎉"
);


/* CLEAR */

document.getElementById(
"name"
).value = "";

document.getElementById(
"price"
).value = "";

document.getElementById(
"category"
).value = "";

document.getElementById(
"place"
).value = "";

document.getElementById(
"sellerPhone"
).value = "";

document.getElementById(
"desc"
).value = "";

document.getElementById(
"productImage"
).value = "";

document.getElementById(
"imagePreview"
).src = "";

document.getElementById(
"imagePreview"
).style.display =
"none";


await loadProducts();

show("home");


}catch(error){

console.error(error);

alert(
"Bidhaa haijahifadhiwa.\n\n" +
"Sababu:\n" +
(error.message || error)
);

}finally{

button.disabled = false;

button.innerText =
"💾 Hifadhi Bidhaa";

}

}


/* ==============================
   PHONE
============================== */

function formatPhone(phone){

phone =
String(phone || "")
.trim()
.replace(/\s+/g,"")
.replace(/-/g,"");


if(phone.startsWith("+255")){

return phone;

}


if(phone.startsWith("255")){

return "+" + phone;

}


if(phone.startsWith("0")){

return "+255" +
phone.substring(1);

}


return phone;

}


/* ==============================
   CALL
============================== */

function callSeller(phone){

const number =
formatPhone(phone);

window.location.href =
"tel:" + number;

}


/* ==============================
   WHATSAPP
============================== */

function openWhatsApp(
phone,
productName
){

const number =
formatPhone(phone)
.replace("+","");


const message =
"Habari, nimeiona bidhaa " +
productName +
" kwenye PLAM TANZANIA. Bado inapatikana?";


const url =
"https://wa.me/" +
number +
"?text=" +
encodeURIComponent(message);


window.open(
url,
"_blank"
);

}


/* ==============================
   REGISTER
============================== */

async function register(){

const name =
document
.getElementById("fullName")
.value
.trim();


const phone =
document
.getElementById("phone")
.value
.trim();


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


if(
!name ||
!phone ||
!email ||
!password
){

alert(
"Jaza taarifa zote."
);

return;

}


try{

const {
data,
error
} =
await supabaseClient
.auth
.signUp({

email:email,

password:password,

options:{
data:{
full_name:name,
phone:phone
}
}

});


if(error){

throw error;

}


alert(
"Akaunti imefunguliwa! 🎉\n" +
"Angalia email yako kwa uthibitisho."
);


}catch(error){

alert(
"Imeshindikana kufungua akaunti:\n" +
error.message
);

}

}


/* ==============================
   LOGIN
============================== */

async function login(){

const email =
document
.getElementById("loginEmail")
.value
.trim();


const password =
document
.getElementById("loginPassword")
.value;


if(
!email ||
!password
){

alert(
"Weka email na password."
);

return;

}


try{

const {
data,
error
} =
await supabaseClient
.auth
.signInWithPassword({

email:email,

password:password

});


if(error){

throw error;

}


alert(
"Umeingia kwenye akaunti! 🎉"
);


}catch(error){

alert(
"Imeshindikana kuingia:\n" +
error.message
);

}

}


/* ==============================
   SECURITY
============================== */

function escapeHTML(value){

return String(value ?? "")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeJS(value){

return String(value ?? "")

.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,'\\"')
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}


/* ==============================
   START
============================== */

loadProducts();

</script>

</body>
</html>
