async function loadProducts(){

if(!supabaseClient){

showSampleProducts();

return;

}

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/Production?select=*",

{

method:"GET",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY

}

}

);

if(!response.ok){

throw new Error(
await response.text()
);

}

ps =
await response.json();

render();

}catch(error){

console.log(
"Load products error:",
error
);

showSampleProducts();

}

}

// ======================================================
// RENDER
// ======================================================

function render(){

const search =
searchInput.value
.toLowerCase()
.trim();

const filtered =
ps.filter(product => {

const name =
String(product.name || "")
.toLowerCase();

const category =
String(product.category || "")
.toLowerCase();

const place =
String(product.place || "")
.toLowerCase();

const description =
String(product.description || "")
.toLowerCase();

return(
name.includes(search) ||
category.includes(search) ||
place.includes(search) ||
description.includes(search)
);

});


if(filtered.length === 0){

productsBox.innerHTML =
"<div class='message'>" +
"Hakuna bidhaa zilizopatikana." +
"</div>";

return;

}


productsBox.innerHTML =
filtered.map(product => {

const icon =
product.icon || "🛍️";

const price =
Number(product.price || 0)
.toLocaleString("sw-TZ");

return `

<div class="card">

<div class="pic">
${icon}
</div>

<h3>
${escapeHTML(product.name || "")}
</h3>

<div class="price">
TSh ${price}
</div>

<div>
📂 ${escapeHTML(product.category || "")}
</div>

<div>
📍 ${escapeHTML(product.place || "")}
</div>

<p>
${escapeHTML(product.description || "")}
</p>

<button
type="button"
class="contactBtn"
data-product="${escapeHTML(product.name || "")}">
Wasiliana na Muuzaji
</button>

</div>

`;

}).join("");


document
.querySelectorAll(".contactBtn")
.forEach(button => {

button.onclick = function(){

const productName =
this.getAttribute("data-product");

alert(
"Mawasiliano na muuzaji wa " +
productName +
" yatafunguliwa hapa."
);

};

});

}


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


// ======================================================
// SEARCH EVENT
// ======================================================

searchInput.addEventListener(
"input",
function(){

render();

});

.forEach(category => {

this.getAttribute("data-category");

value;

render();

};

});
