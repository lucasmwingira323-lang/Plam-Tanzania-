<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAM TANZANIA</title>

<style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}
header{background:#0b6b3a;color:#fff;padding:20px}
.wrap{max-width:900px;margin:auto;padding:18px}
.search,input,select,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.cats,.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat,.card,.form{background:#fff;padding:15px;border-radius:14px;box-shadow:0 2px 8px #0001}
.cat{text-align:center}
.pic{height:100px;background:#e9eef0;border-radius:10px;display:grid;place-items:center;font-size:42px}
.price{font-weight:bold;margin:7px 0}
button{padding:12px 16px;border:0;border-radius:10px;background:#0b6b3a;color:#fff}
nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}
nav button{background:none;color:#17202a}
.hidden{display:none}

@media(min-width:650px){
.cats{grid-template-columns:repeat(4,1fr)}
.products{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<header>
<div style="font-size:25px;font-weight:bold">🇹🇿 PLAM TANZANIA</div>
<div>Jenga biashara yako. Fikia wateja zaidi.</div>
</header>

<div style="text-align:center;padding:15px">
<button onclick="show('account')">Fungua Akaunti</button>
<button onclick="show('account')">Ingia</button>
</div>

<main class="wrap">

<section id="home">

<input id="search"
class="search"
placeholder="🔍 Tafuta bidhaa au huduma..."
oninput="render()">

<h2>📂 Categories</h2>

<div class="cats">
<div class="cat">👕<br>Mavazi</div>
<div class="cat">📱<br>Electronics</div>
<div class="cat">🏠<br>Nyumba</div>
<div class="cat">🚗<br>Magari</div>
<div class="cat">🌾<br>Kilimo</div>
<div class="cat">💄<br>Urembo</div>
<div class="cat">📚<br>Elimu</div>
<div class="cat">🔧<br>Huduma</div>
</div>

<h2>🔥 Bidhaa</h2>
<div id="products" class="products"></div>

</section>


<section id="add" class="hidden">

<h2>➕ Weka Bidhaa Yako</h2>

<div class="form">

<input id="name" placeholder="Jina la bidhaa">

<input id="price" type="number" placeholder="Bei (TSh)">

<select id="category">
<option>Mavazi</option>
<option>Electronics</option>
<option>Nyumba</option>
<option>Magari</option>
<option>Kilimo</option>
<option>Urembo</option>
<option>Elimu</option>
<option>Huduma</option>
</select>

<input id="place" placeholder="Eneo, mfano Mbeya">

<textarea id="desc"
placeholder="Maelezo ya bidhaa"></textarea>

<button onclick="add()">Chapisha Bidhaa</button>

</div>
</section>


<section id="account" class="hidden">

<h2>👤 Akaunti</h2>

<div class="form">

<input id="fullName" placeholder="Jina kamili">

<input id="phone" placeholder="Namba ya simu">

<input id="email" type="email" placeholder="Barua pepe">

<input id="password" type="password" placeholder="Password">

<button onclick="registerUser()">
Jisajili
</button>

</div>
</section>

</main>


<nav>

<button onclick="show('home')">
🏠<br>Home
</button>

<button onclick="show('home');document.getElementById('search').focus()">
🔍<br>Tafuta
</button>

<button onclick="show('add')">
➕<br>Weka Bidhaa
</button>

<button onclick="alert('Ujumbe wa mnunuzi na muuzaji utaongezwa hapa.')">
💬<br>Ujumbe
</button>

<button onclick="show('account')">
👤<br>Akaunti
</button>

</nav>


<script>

// ==============================
// SUPABASE
// ==============================

const SUPABASE_URL =
"https://igcgcxkttzeaordqhqqy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9M77SZxUBNK1srWkuGP11w_Y4ES8s8D";
const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
); 
let ps = [];


// ==============================
// LOAD PRODUCTS
// ==============================

async function loadProducts(){

try{

const response = await fetch(
SUPABASE_URL + "/rest/v1/Production?select=*",
{
method:"GET",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY
}
}
);

if(!response.ok){

const error = await response.text();

console.log("Supabase error:",error);

throw new Error("Database error");

}

ps = await response.json();

render();

}catch(error){

console.log(error);

ps = [

{
name:"Samsung A05",
price:250000,
category:"Electronics",
place:"Mbeya",
icon:"📱"
},

{
name:"Viatu vya Michezo",
price:45000,
category:"Mavazi",
place:"Mbinga",
icon:"👟"
},

{
name:"Sofa Set",
price:650000,
category:"Nyumba",
place:"Mbeya",
icon:"🛋️"
},

{
name:"Mbegu za Mahindi",
price:12000,
category:"Kilimo",
place:"Ruvuma",
icon:"🌾"
}

];

render();

}

}


// ==============================
// RENDER PRODUCTS
// ==============================

function render(){

const box =
document.getElementById("products");

const search =
document.getElementById("search").value
.toLowerCase()
.trim();


const filtered = ps.filter(product => {

const name =
String(product.name || "")
.toLowerCase();

const category =
String(product.category || "")
.toLowerCase();

const place =
String(product.place || "")
.toLowerCase();

return (
name.includes(search) ||
category.includes(search) ||
place.includes(search)
);

});


if(filtered.length === 0){

box.innerHTML =
"<p>Hakuna bidhaa zilizopatikana.</p>";

return;

}


box.innerHTML = filtered.map(product => {

const icon =
product.icon || "🛍️";

const price =
Number(product.price || 0)
.toLocaleString();


return `

<div class="card">

<div class="pic">
${icon}
</div>

<h3>
${product.name || ""}
</h3>

<div class="price">
TSh ${price}
</div>

<div>
📂 ${product.category || ""}
</div>

<div>
📍 ${product.place || ""}
</div>

<p>
${product.description || ""}
</p>

<button
onclick="alert('Mawasiliano na muuzaji yatafunguliwa hapa.')">

Wasiliana na Muuzaji

</button>

</div>

`;

}).join("");

}


// ==============================
// ADD PRODUCT
// ==============================

async function add(){

const name =
document.getElementById("name").value.trim();

const price =
document.getElementById("price").value.trim();

const category =
document.getElementById("category").value;

const place =
document.getElementById("place").value.trim();

const description =
document.getElementById("desc").value.trim();


if(!name || !price || !place){

alert(
"Jaza jina, bei na eneo."
);

return;

}


try{

const response = await fetch(

SUPABASE_URL + "/rest/v1/Production",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

name:name,

price:Number(price),

category:category,

place:place,

description:description

})

}

);


if(!response.ok){

const error =
await response.text();

console.log(
"Supabase insert error:",
error
);

throw new Error(
error
);

}

alert(
"🎉 Bidhaa imehifadhiwa kwenye PLAM!"
);


document.getElementById("name").value="";

document.getElementById("price").value="";

document.getElementById("place").value="";

document.getElementById("desc").value="";


await loadProducts();

show("home");

}catch(error){

console.log(error);

alert(

);console.log("SUPABASE ERROR:", error);

alert(
"Bidhaa haijahifadhiwa: " + (error?.message || "Kuna kosa.")
);

}

}


// ==============================
// NAVIGATION
// ==============================

function show(id){

["home","add","account"].forEach(x=>{

document
.getElementById(x)
.classList
.toggle(
"hidden",
x !== id
);

});

}


// ==============================
// START
// ==============================

loadProducts();loadProducts();

async function registerUser() {
  const fullName = document.getElementById("fullName").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!fullName || !phone || !email || !password) {
    alert("Tafadhali jaza taarifa zote.");
    return;
  }

  const { data, error } = await supabase.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        full_name: fullName,
        phone: phone
      }
    }
  });

  if (error) {
    alert("Usajili umeshindikana: " + error.message);
    return;
  }

  alert("Akaunti imefunguliwa! Angalia email yako kwa uthibitisho.");
}

</script>

</script>

</body>
</html>
